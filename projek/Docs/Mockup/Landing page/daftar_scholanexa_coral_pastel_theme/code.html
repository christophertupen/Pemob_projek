<!DOCTYPE html><html lang="id"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Registrasi Akun - ScholaNexa</title>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<!-- Tailwind CSS v3 CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              coral: '#DE7272',
              peach: '#FFCA88',
              yellow: '#FFF6A9',
              mint: '#B4E4D6',
              navy: '#17212B',
              muted: '#64717D',
              surface: '#FFFFFF',
              bg: '#F8F9FA',
              border: '#E5E7EB',
              inputBg: '#FFFFFF',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          borderRadius: {
            'ios': '44px',
            'm3': '16px',
          },
          boxShadow: {
            'subtle': '0 2px 6px -1px rgba(0, 0, 0, 0.04), 0 1px 3px -1px rgba(0, 0, 0, 0.02)',
            'btn': '0 4px 12px rgba(222, 114, 114, 0.28)',
          }
        }
      }
    }
  </script>
<style data-purpose="custom-utilities">
    /* Material 3 icon base settings */
    .material-symbols-outlined {
      font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }

    /* Hide default scrollbars for mobile mockup smoothness */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-0 sm:p-4 text-brand-navy font-sans antialiased selection:bg-brand-peach/40">
<!-- BEGIN: MobileContainer -->
<!-- iPhone 15/14 Pro standard viewport dimension simulation: 390px x 844px -->
<main class="w-[390px] min-h-[844px] h-[844px] bg-[#F8F9FA] text-[#17212B] flex flex-col justify-between relative shadow-2xl rounded-[48px] overflow-hidden border-[8px] border-[#17212B] select-none shrink-0">
<!-- BEGIN: iOSStatusBar -->
<header class="w-full h-11 px-6 flex items-center justify-between z-20 shrink-0 select-none relative"><span class="text-[14px] font-semibold tracking-tight text-brand-navy">09:41</span><div class="absolute left-1/2 -translate-x-1/2 top-2.5 w-28 h-7 bg-black rounded-full flex items-center justify-end pr-2.5"><div class="w-2.5 h-2.5 rounded-full bg-[#111c24]/90 border border-slate-700/40"></div></div><div class="flex items-center space-x-1.5 text-brand-navy"><span class="material-symbols-outlined text-[16px] leading-none">signal_cellular_alt</span><span class="material-symbols-outlined text-[16px] leading-none">wifi</span><span class="material-symbols-outlined text-[19px] leading-none">battery_full</span></div></header>
<!-- END: iOSStatusBar -->
<!-- BEGIN: TopBar -->
<section class="px-5 pt-3 pb-2 flex items-center shrink-0">
<!-- Back button matching the pill-card style from wireframe -->
<button aria-label="Kembali" class="w-10 h-10 rounded-xl bg-white border border-brand-border flex items-center justify-center text-brand-navy hover:bg-slate-50 transition active:scale-95 shadow-xs" type="button">
<span class="material-symbols-outlined text-[20px]">arrow_back_ios_new</span>
</button>
<!-- Screen Title -->
<h1 class="ml-3 text-lg font-bold text-brand-navy tracking-tight">
        Pendaftaran Akun
      </h1>
</section>
<!-- END: TopBar -->
<!-- BEGIN: ScrollableContent -->
<div class="flex-1 overflow-y-auto no-scrollbar px-5 pb-4 pt-1 flex flex-col justify-between">
<div>
<!-- BEGIN: SegmentedControl -->
<!-- 2-segmented tab corresponding to wireframe top tab bar -->
<nav aria-label="Tipe Pengguna" class="p-1.5 bg-slate-200/70 rounded-2xl flex items-center gap-1.5 mb-5 border border-slate-200/50"><!-- Inactive Tab (Siswa) -->
<button class="flex-1 py-2 rounded-xl font-medium text-xs text-brand-muted hover:text-brand-navy bg-transparent transition text-center flex items-center justify-center gap-1" type="button">
<span class="material-symbols-outlined text-base">school</span>
<span class="">Siswa</span>
</button>
<!-- Active Tab (Orang Tua) -->
<button class="flex-1 py-2 rounded-xl font-semibold text-xs text-white bg-brand-navy shadow-sm transition text-center flex items-center justify-center gap-1" type="button">
<span class="material-symbols-outlined text-base">family_restroom</span>
<span class="">Orang Tua</span>
</button>
<!-- Inactive Tab (Guru) -->
<button class="flex-1 py-2 rounded-xl font-medium text-xs text-brand-muted hover:text-brand-navy bg-transparent transition text-center flex items-center justify-center gap-1" type="button">
<span class="material-symbols-outlined text-base">badge</span>
<span class="">Guru</span>
</button></nav>
<!-- END: SegmentedControl -->
<!-- BEGIN: RegistrationForm -->
<!-- 5 form fields stacked exactly as in wireframe -->
<form class="space-y-3.5" onsubmit="event.preventDefault()">
<!-- Field 1: Nama Lengkap -->
<div class="space-y-1.5">
<label class="block text-xs font-semibold text-brand-navy tracking-wide" for="fullName">
              Nama Lengkap
            </label>
<div class="relative">
<input class="w-full h-11 px-3.5 bg-white border border-brand-border rounded-xl text-xs font-medium text-brand-navy placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-coral/40 focus:border-brand-coral transition" id="fullName" name="fullName" placeholder="Contoh: Rian Anggoro" type="text">
</div>
</div>
<!-- Field 2: Nomor Telepon / WhatsApp -->
<div class="space-y-1.5">
<label class="block text-xs font-semibold text-brand-navy tracking-wide" for="phoneNumber">
              Nomor WhatsApp / Telepon
            </label>
<div class="relative">
<input class="w-full h-11 px-3.5 bg-white border border-brand-border rounded-xl text-xs font-medium text-brand-navy placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-coral/40 focus:border-brand-coral transition" id="phoneNumber" name="phoneNumber" placeholder="Contoh: 0812 3456 7890" type="tel">
</div>
</div>
<!-- Field 3: Email -->
<div class="space-y-1.5">
<label class="block text-xs font-semibold text-brand-navy tracking-wide" for="emailAddress">
              Alamat Email
            </label>
<div class="relative">
<input class="w-full h-11 px-3.5 bg-white border border-brand-border rounded-xl text-xs font-medium text-brand-navy placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-coral/40 focus:border-brand-coral transition" id="emailAddress" name="emailAddress" placeholder="orangtua@scholanexa.id" type="email">
</div>
</div>
<!-- Field 4: Kata Sandi -->
<!-- Field: NIS Anak -->
<div class="space-y-1.5">
<label class="block text-xs font-semibold text-brand-navy tracking-wide" for="childNis">
  Nomor Induk Siswa (NIS) Anak
</label>
<div class="relative">
  <input class="w-full h-11 px-3.5 bg-white border border-brand-border rounded-xl text-xs font-medium text-brand-navy placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-coral/40 focus:border-brand-coral transition" id="childNis" name="childNis" placeholder="Masukkan NIS anak Anda" type="text">
</div>
</div><div class="space-y-1.5">
<label class="block text-xs font-semibold text-brand-navy tracking-wide" for="password">
              Kata Sandi
            </label>
<div class="relative">
<input class="w-full h-11 pl-3.5 pr-10 bg-white border border-brand-border rounded-xl text-xs font-medium text-brand-navy placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-coral/40 focus:border-brand-coral transition" id="password" name="password" placeholder="Minimal 8 karakter unik" type="password">
<button aria-label="Tampilkan kata sandi" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-brand-navy transition flex items-center" type="button">
<span class="material-symbols-outlined text-[19px]">visibility</span>
</button>
</div>
</div>
<!-- Field 5: Konfirmasi Kata Sandi -->
<div class="space-y-1.5">
<label class="block text-xs font-semibold text-brand-navy tracking-wide" for="confirmPassword">
              Konfirmasi Kata Sandi
            </label>
<div class="relative">
<input class="w-full h-11 pl-3.5 pr-10 bg-white border border-brand-border rounded-xl text-xs font-medium text-brand-navy placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-coral/40 focus:border-brand-coral transition" id="confirmPassword" name="confirmPassword" placeholder="Ulangi kata sandi di atas" type="password">
<button aria-label="Tampilkan konfirmasi kata sandi" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-brand-navy transition flex items-center" type="button">
<span class="material-symbols-outlined text-[19px]">visibility</span>
</button>
</div>
</div>
</form>
<!-- END: RegistrationForm -->
</div>
<!-- BEGIN: BottomControls -->
<div class="pt-4 space-y-4">
<!-- Primary Action Button (Matches solid black/dark container in wireframe with brand styling) -->
<button class="w-full h-12 bg-[#DE7272] hover:bg-[#d46565] active:scale-[0.99] text-[#17212B] font-bold rounded-xl text-sm shadow-md transition-all flex items-center justify-center gap-2 tracking-wide group" type="button">
<span class="">Lanjutkan Pendaftaran</span>
<span class="material-symbols-outlined text-base group-hover:translate-x-0.5 transition-transform">arrow_forward</span>
</button>
<!-- Stepper / Indicator Dots (2 items matching bottom of wireframe) -->
<div aria-label="Indikator Langkah" class="flex items-center justify-center gap-2 pb-1">
<!-- Active step indicator (pill shape) -->
<div class="w-8 h-1.5 rounded-full bg-brand-coral"></div>
<!-- Inactive step indicator -->
<div class="w-4 h-1.5 rounded-full bg-brand-border"></div>
</div>
</div>
<!-- END: BottomControls -->
</div>
<!-- END: ScrollableContent -->
<!-- BEGIN: iOSHomeIndicator -->
<footer class="w-full pb-2 pt-1 flex justify-center shrink-0">
<div class="w-32 h-1 bg-slate-300 rounded-full"></div>
</footer>
<!-- END: iOSHomeIndicator -->
</main>
<!-- END: MobileContainer -->




</body></html>
