<!DOCTYPE html><html lang="id"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Verifikasi OTP - ScholaNexa</title>
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Inter & Material Symbols Outlined -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              coral: '#DE7272',
              peach: '#FFCA88',
              yellow: '#FFF6A9',
              mint: '#B4E4D6',
              navy: '#17212B',
              muted: '#64717D',
              surface: '#FFFFFF',
              bg: '#F8F9FA',
              border: '#E5E7EB'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style data-purpose="custom-styling">
    /* Custom pulsing cursor animation for active OTP digit */
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .animate-blink {
      animation: blink 1.1s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    /* Keypad button active press state */
    .keypad-key:active {
      transform: scale(0.96);
      background-color: #F1F3F5;
    }
  </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4 font-sans select-none antialiased">
<!-- BEGIN: PhoneContainer -->
<!-- 390x844 iPhone Canvas layout following wireframe https://lh3.googleusercontent.com/aida-public/AB6AXuC502H3s3LWaY-uLXhukdZAM5zmoT5tukRmV5rjyRMgvtvBtlYfPCl5jMd0ziju2Zi_mh_QrLJ8VP4RvZAPy_hsQyJv2S4Z-68Sg4h8gQAAqp_fGY4_GnRbldauK-xJ3pgEIicELaENo7VA9fStWGB_Rs1SzYmAjkA0vMK5XV8AcAWpB8DUw8XmXbZDCpTNlsTrFg4ig-sRj6mkq4lb74fmarE5MAMzs43UfB0lvlkW51onA9sCbhYH -->
<main class="w-[390px] h-[844px] min-h-[844px] bg-[#F8F9FA] rounded-[48px] shadow-2xl relative flex flex-col justify-between overflow-hidden border-[8px] border-[#17212B]">
<!-- BEGIN: TopBarSection -->
<header class="w-full pt-0 px-6 z-20" data-purpose="status-and-top-bar">
<!-- iOS Status Bar with Dynamic Island Pill -->
<div class="flex justify-between items-center h-11 relative"><span class="text-xs font-semibold tracking-tight text-brand-navy">09:41</span><div class="absolute left-1/2 -translate-x-1/2 w-28 h-7 bg-black rounded-full flex items-center justify-end px-2.5"><div class="w-2.5 h-2.5 rounded-full bg-[#17212B] border border-gray-800"></div></div><div class="flex items-center space-x-1.5 text-brand-navy"><span class="material-symbols-outlined text-[15px]">signal_cellular_alt</span><span class="material-symbols-outlined text-[15px]">wifi</span><span class="material-symbols-outlined text-[17px]">battery_full</span></div></div>
<!-- App Header Navigation -->
<div class="mt-4 flex items-center">
<!-- Back Button -->
<button aria-label="Kembali" class="w-10 h-10 rounded-2xl bg-white border border-brand-border flex items-center justify-center text-brand-navy shadow-sm hover:bg-slate-50 transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">arrow_back_ios_new</span>
</button>
</div>
</header>
<!-- END: TopBarSection -->
<!-- BEGIN: MainContentArea -->
<section class="px-6 flex flex-col flex-1 justify-start pt-6" data-purpose="otp-content">
<!-- Title & Subtitle block matching top grey wireframe bars -->
<div class="space-y-2 mb-8">
<h1 class="text-2xl font-bold text-brand-navy leading-tight tracking-tight">
          Masukkan Kode Verifikasi
        </h1>
<p class="text-sm text-brand-muted leading-relaxed font-normal pr-4">
          Kode verifikasi 6 digit telah dikirimkan ke nomor WhatsApp / email Anda.
        </p>
</div>
<!-- OTP 6-Digit Display Row -->
<!-- Matches exact wireframe 6 boxes: first has active indicator, remaining 5 have subtle dots -->
<div class="flex justify-between items-center gap-2 mb-6" data-purpose="otp-boxes">
<!-- Box 1: Active with focus border and cursor line -->
<div class="w-12 h-14 bg-white rounded-2xl border-2 border-brand-coral flex items-center justify-center shadow-sm">
<div class="w-0.5 h-7 bg-brand-navy rounded-full animate-blink"></div>
</div>
<!-- Box 2: Dot placeholder -->
<div class="w-12 h-14 bg-white rounded-2xl border border-brand-border flex items-center justify-center shadow-sm">
<div class="w-2 h-2 rounded-full bg-slate-300"></div>
</div>
<!-- Box 3: Dot placeholder -->
<div class="w-12 h-14 bg-white rounded-2xl border border-brand-border flex items-center justify-center shadow-sm">
<div class="w-2 h-2 rounded-full bg-slate-300"></div>
</div>
<!-- Box 4: Dot placeholder -->
<div class="w-12 h-14 bg-white rounded-2xl border border-brand-border flex items-center justify-center shadow-sm">
<div class="w-2 h-2 rounded-full bg-slate-300"></div>
</div>
<!-- Box 5: Dot placeholder -->
<div class="w-12 h-14 bg-white rounded-2xl border border-brand-border flex items-center justify-center shadow-sm">
<div class="w-2 h-2 rounded-full bg-slate-300"></div>
</div>
<!-- Box 6: Dot placeholder -->
<div class="w-12 h-14 bg-white rounded-2xl border border-brand-border flex items-center justify-center shadow-sm">
<div class="w-2 h-2 rounded-full bg-slate-300"></div>
</div>
</div>
<!-- Resend Timer Pill (matches horizontal grey capsule in wireframe) -->
<div class="flex justify-center mb-6" data-purpose="resend-timer-pill">
<div class="inline-flex items-center gap-1.5 px-4 py-1.5 rounded-full bg-slate-200/80 text-brand-muted text-xs font-medium">
<span class="material-symbols-outlined text-[14px]">schedule</span>
<span class="">Kirim ulang kode dalam <strong class="text-brand-navy font-semibold">00:54</strong></span>
</div>
</div>
<!-- Custom Numeric Keypad (3x4 Layout matching wireframe) -->
<div class="grid grid-cols-3 gap-2.5 mt-auto mb-5" data-purpose="numeric-keypad">
<!-- Digit 1 -->
<button class="keypad-key h-12 bg-white rounded-2xl border border-brand-border/90 flex items-center justify-center shadow-sm font-semibold text-lg text-brand-navy transition duration-75" type="button">
          1
        </button>
<!-- Digit 2 -->
<button class="keypad-key h-12 bg-white rounded-2xl border border-brand-border/90 flex items-center justify-center shadow-sm font-semibold text-lg text-brand-navy transition duration-75" type="button">
          2
        </button>
<!-- Digit 3 -->
<button class="keypad-key h-12 bg-white rounded-2xl border border-brand-border/90 flex items-center justify-center shadow-sm font-semibold text-lg text-brand-navy transition duration-75" type="button">
          3
        </button>
<!-- Digit 4 -->
<button class="keypad-key h-12 bg-white rounded-2xl border border-brand-border/90 flex items-center justify-center shadow-sm font-semibold text-lg text-brand-navy transition duration-75" type="button">
          4
        </button>
<!-- Digit 5 -->
<button class="keypad-key h-12 bg-white rounded-2xl border border-brand-border/90 flex items-center justify-center shadow-sm font-semibold text-lg text-brand-navy transition duration-75" type="button">
          5
        </button>
<!-- Digit 6 -->
<button class="keypad-key h-12 bg-white rounded-2xl border border-brand-border/90 flex items-center justify-center shadow-sm font-semibold text-lg text-brand-navy transition duration-75" type="button">
          6
        </button>
<!-- Digit 7 -->
<button class="keypad-key h-12 bg-white rounded-2xl border border-brand-border/90 flex items-center justify-center shadow-sm font-semibold text-lg text-brand-navy transition duration-75" type="button">
          7
        </button>
<!-- Digit 8 -->
<button class="keypad-key h-12 bg-white rounded-2xl border border-brand-border/90 flex items-center justify-center shadow-sm font-semibold text-lg text-brand-navy transition duration-75" type="button">
          8
        </button>
<!-- Digit 9 -->
<button class="keypad-key h-12 bg-white rounded-2xl border border-brand-border/90 flex items-center justify-center shadow-sm font-semibold text-lg text-brand-navy transition duration-75" type="button">
          9
        </button>
<!-- Empty slot in 3x4 layout (bottom-left) -->
<div class="h-12 pointer-events-none"></div>
<!-- Digit 0 -->
<button class="keypad-key h-12 bg-white rounded-2xl border border-brand-border/90 flex items-center justify-center shadow-sm font-semibold text-lg text-brand-navy transition duration-75" type="button">
          0
        </button>
<!-- Backspace Delete Button (bottom-right with delete icon) -->
<button aria-label="Hapus digit" class="keypad-key h-12 bg-slate-100/90 rounded-2xl border border-brand-border/80 flex items-center justify-center text-brand-navy shadow-sm transition duration-75" type="button">
<span class="material-symbols-outlined text-[20px]">backspace</span>
</button>
</div>
</section>
<!-- END: MainContentArea -->
<!-- BEGIN: BottomActionSection -->
<footer class="w-full px-6 pb-2 pt-1 flex flex-col items-center" data-purpose="action-and-home-indicator">
<!-- Primary Action Button (Matches solid dark block in wireframe) -->
<button class="w-full h-13 py-3.5 bg-brand-coral hover:bg-[#d66565] active:scale-[0.99] rounded-2xl shadow-md text-brand-navy font-semibold text-base flex items-center justify-center transition-all duration-150" type="button">
        Verifikasi &amp; Lanjutkan
      </button>
<!-- iOS Home Indicator bar -->
<div class="w-32 h-1 bg-slate-400 rounded-full mt-4 mb-2 opacity-80" data-purpose="home-indicator"></div>
</footer>
<!-- END: BottomActionSection -->
</main>
<!-- END: PhoneContainer -->


</body></html>
