<!DOCTYPE html><html lang="id"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>ScholaNexa - Atur Ulang Kata Sandi</title>
<!-- Tailwind CSS CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<!-- Tailwind Custom Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              coral: '#DE7272',
              peach: '#FFCA88',
              yellow: '#FFF6A9',
              mint: '#B4E4D6',
              mintDark: '#207A65',
              navy: '#17212B',
              muted: '#64717D',
              card: '#FFFFFF',
              bg: '#F8F9FA',
              border: '#E5E7EB'
            }
          }
        }
      }
    }
  </script>
<!-- Global Custom Styles -->
<style data-purpose="custom-styling">
    body {
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      background-color: #ECEFF1;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
    }
    .material-symbols-outlined.fill-1 {
      font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 md:p-6 bg-slate-200 selection:bg-brand-peach/40">
<!-- BEGIN: PhoneContainer -->
<!-- Mimics mobile iOS device viewport 390x844 following exact wireframe structure -->
<div class="relative w-[390px] h-[844px] min-h-[844px] bg-[#F8F9FA] rounded-[48px] shadow-2xl border-[8px] border-[#17212B] overflow-hidden flex flex-col justify-between select-none" data-purpose="device-viewport">
<!-- Top Status Bar & Dynamic Island -->
<header class="w-full h-[44px] px-6 flex items-center justify-between z-20 shrink-0 relative" data-purpose="status-bar">
<span class="text-[14px] font-semibold tracking-tight text-[#17212B]">09:41</span>
<div class="absolute left-1/2 -translate-x-1/2 top-2 w-28 h-7 bg-black rounded-full flex items-center justify-end pr-2 space-x-1 shadow-inner">
<div class="w-2.5 h-2.5 bg-slate-900 rounded-full border border-slate-800"></div>
</div>
<div class="flex items-center space-x-1.5 text-[#17212B]">
<span class="material-symbols-outlined text-[16px] leading-none">signal_cellular_alt</span>
<span class="material-symbols-outlined text-[16px] leading-none">wifi</span>
<span class="material-symbols-outlined text-[19px] leading-none">battery_full</span>
</div>
</header>
<!-- BEGIN: MainContentArea -->
<!-- Scrollable main body containing back button, headers, input, confirmation indicator, and CTA -->
<main class="flex-1 px-6 pt-5 pb-6 flex flex-col justify-start overflow-y-auto" data-purpose="main-screen-content">
<!-- Navigation Header: Back Button -->
<!-- Matches rounded square icon button in wireframe -->
<div class="mb-7">
<button aria-label="Kembali" class="w-12 h-12 bg-white rounded-2xl border border-brand-border shadow-sm flex items-center justify-center text-brand-navy hover:bg-slate-50 active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[24px]">arrow_back_ios_new</span>
</button>
</div>
<!-- Header Typography: Title & Subtitle matching upper bars in wireframe -->
<section class="mb-6" data-purpose="header-section">
<h1 class="text-[25px] font-bold text-brand-navy tracking-tight leading-snug mb-2">
          Atur Kata Sandi Baru
        </h1>
<p class="text-[14px] text-brand-muted leading-relaxed">
          Masukkan kata sandi baru untuk akun ScholaNexa Anda. Pastikan kata sandi aman dan mudah diingat.
        </p>
</section>
<!-- BEGIN: PasswordForm -->
<form class="space-y-4" data-purpose="password-reset-form" onsubmit="event.preventDefault();">
<!-- Form Field: Input Label & Input Box -->
<!-- Matches the prominent input rectangle in wireframe -->
<div class="space-y-2">
<label class="block text-[13px] font-semibold text-brand-navy" for="new-password">
            Kata Sandi Baru
          </label>
<div class="relative flex items-center">
<input class="w-full h-[58px] bg-white text-brand-navy text-[15px] font-medium px-4 pr-12 rounded-2xl border border-brand-border focus:border-brand-coral focus:ring-2 focus:ring-brand-coral/20 focus:outline-none transition-all shadow-sm" id="new-password" placeholder="Minimal 8 karakter unik" type="password" value="ScholaNexa2025#">
<button aria-label="Tampilkan sandi" class="absolute right-4 text-brand-muted hover:text-brand-navy p-1 transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Requirement / Status Verification Card -->
<!-- Matches the second rectangle with circle checkmark icon in wireframe -->
<div class="w-full p-4 rounded-2xl border border-brand-border bg-white shadow-sm flex items-center space-x-3.5" data-purpose="criteria-card">
<div class="w-8 h-8 rounded-full bg-brand-mint/40 flex items-center justify-center flex-shrink-0 text-brand-mintDark border border-brand-mint">
<span class="material-symbols-outlined text-[19px] font-bold">check</span>
</div>
<div class="flex-1 min-w-0">
<p class="text-[13px] font-semibold text-brand-navy tracking-tight leading-tight">
              Syarat Keamanan Terpenuhi
            </p>
<p class="text-[11.5px] text-brand-muted tracking-tight mt-0.5 leading-tight">
              Kombinasi minimal 8 huruf, angka &amp; simbol unik
            </p>
</div>
</div>
<!-- Primary Action Button -->
<!-- Matches the bottom action button in wireframe -->
<div class="pt-2">
<button class="w-full h-[56px] bg-brand-coral text-brand-navy font-bold text-[15px] rounded-2xl shadow-sm hover:opacity-95 active:scale-[0.99] transition-all flex items-center justify-center space-x-2" type="submit">
<span class="">Simpan Kata Sandi</span>
</button>
</div>
</form>
<!-- END: PasswordForm -->
</main>
<!-- END: MainContentArea -->
<!-- BEGIN: HomeIndicator -->
<!-- iOS bottom gesture navigation bar -->
<footer class="w-full pb-2.5 pt-1 flex justify-center items-center pointer-events-none shrink-0" data-purpose="home-indicator">
<div class="w-32 h-1 bg-slate-300 rounded-full"></div>
</footer>
<!-- END: HomeIndicator -->
</div>
<!-- END: PhoneContainer -->


</body></html>
