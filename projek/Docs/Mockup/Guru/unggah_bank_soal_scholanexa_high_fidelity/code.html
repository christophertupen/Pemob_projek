<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ScholaNexa - Unggah Bank Soal</title>
<!-- Google Fonts: Inter & Material Symbols Outlined -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<!-- Tailwind CSS CDN with Forms & Container Queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              coral: '#FF7F50',
              coralHover: '#ff6f3d',
              navy: '#172033',
              yellow: '#FFD166',
              mint: '#06D6A0',
              ocean: '#118AB2',
            },
            surface: {
              bg: '#F7F9FC',
              card: '#FFFFFF',
              border: '#E5E9F0',
            },
            content: {
              primary: '#191C1F',
              secondary: '#626B78',
              muted: '#94A3B8',
            }
          }
        }
      }
    }
  </script>
<!-- Custom CSS for icon rendering and scrollbar management -->
<style data-purpose="typography">
    .material-symbols-outlined {
      font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
    .material-symbols-outlined.fill {
      font-variation-settings: 'FILL' 1;
    }
  </style>
<style data-purpose="device-styling">
    /* Hide scrollbars for seamless native app aesthetic */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-2 sm:p-6 font-sans antialiased text-content-primary selection:bg-brand-coral selection:text-white">
<!-- BEGIN: PhoneFrameWrapper -->
<!-- Outer Smartphone Frame with 40px rounded corners and dark bezel -->
<div class="relative w-[390px] h-[844px] bg-brand-navy rounded-[48px] p-3 shadow-2xl ring-1 ring-slate-800/80 flex flex-col justify-between overflow-hidden shrink-0 select-none">
<!-- Outer rim highlight reflection -->
<div class="absolute inset-0 rounded-[48px] border border-white/10 pointer-events-none z-50"></div>
<!-- BEGIN: SmartphoneInnerDisplay -->
<div class="relative w-full h-full bg-surface-bg rounded-[38px] overflow-hidden flex flex-col justify-between">
<!-- BEGIN: DynamicIslandAndStatusBar -->
<!-- Hardware top elements: Notch cutout & Apple-style status bar -->
<header class="relative w-full pt-3 px-7 flex items-center justify-between text-xs font-semibold text-content-primary z-40 bg-surface-bg select-none" data-purpose="status-bar">
<!-- Left Time -->
<span class="tracking-tight text-[13px] font-semibold">09:41</span>
<!-- Center Dynamic Island Camera Cutout -->
<div class="absolute left-1/2 -translate-x-1/2 top-2.5 w-28 h-[26px] bg-black rounded-full flex items-center justify-between px-2.5 pointer-events-none shadow-sm" data-purpose="dynamic-island">
<div class="w-2.5 h-2.5 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center">
<div class="w-1 h-1 rounded-full bg-blue-950/60"></div>
</div>
<div class="w-2 h-2 rounded-full bg-zinc-900/80"></div>
</div>
<!-- Right System Indicators -->
<div class="flex items-center gap-1.5 text-content-primary text-[11px]">
<span class="material-symbols-outlined text-[15px] font-semibold leading-none">signal_cellular_alt</span>
<span class="material-symbols-outlined text-[15px] font-semibold leading-none">wifi</span>
<!-- Battery Pill Indicator -->
<div class="w-5 h-2.5 border border-content-primary rounded-[3px] p-0.5 flex items-center relative ml-0.5">
<div class="h-full w-full bg-content-primary rounded-[1px]"></div>
<div class="absolute -right-1 top-0.5 w-0.5 h-1.5 bg-content-primary rounded-r-[1px]"></div>
</div>
</div>
</header>
<!-- END: DynamicIslandAndStatusBar -->
<!-- BEGIN: AppHeader -->
<!-- Top Action Bar with Back Button and View Title -->
<section class="px-5 pt-3 pb-2 flex items-center gap-3.5 bg-surface-bg" data-purpose="app-header">
<!-- Back Circular Button -->
<button aria-label="Kembali" class="w-10 h-10 rounded-full border border-surface-border bg-white flex items-center justify-center text-content-primary hover:bg-slate-50 transition active:scale-95 shadow-xs" type="button">
<span class="material-symbols-outlined text-xl">arrow_back_ios_new</span>
</button>
<!-- Screen Title -->
<h1 class="text-[17px] font-bold text-content-primary tracking-tight">Unggah Bank Soal</h1>
</section>
<!-- END: AppHeader -->
<!-- BEGIN: FormContentScrollArea -->
<!-- Main Content scrollable area matching layout specs -->
<main class="flex-1 overflow-y-auto px-5 pt-2 pb-4 no-scrollbar space-y-4" data-purpose="upload-form">
<!-- Field 1: Judul -->
<div data-purpose="form-group-title">
<label class="block text-xs font-semibold text-content-primary mb-1.5" for="input-judul">
            Judul
          </label>
<input class="w-full bg-white border border-surface-border rounded-xl px-4 py-3 text-sm text-content-primary placeholder-content-muted focus:outline-none focus:border-brand-coral focus:ring-1 focus:ring-brand-coral transition" id="input-judul" name="judul" placeholder="Contoh: Latihan SNBT Penalaran Matematika" type="text"/>
</div>
<!-- Field 2: Deskripsi -->
<div data-purpose="form-group-description">
<label class="block text-xs font-semibold text-content-primary mb-1.5" for="input-deskripsi">
            Deskripsi
          </label>
<textarea class="w-full bg-white border border-surface-border rounded-xl px-4 py-3 text-sm text-content-primary placeholder-content-muted h-24 resize-none focus:outline-none focus:border-brand-coral focus:ring-1 focus:ring-brand-coral transition leading-relaxed" id="input-deskripsi" name="deskripsi" placeholder="Jelaskan isi dan tingkat kesulitan soal" rows="3"></textarea>
</div>
<!-- Field 3: Mata Pelajaran (Dropdown Select) -->
<div data-purpose="form-group-subject">
<label class="block text-xs font-semibold text-content-primary mb-1.5" for="input-mapel">
            Mata Pelajaran
          </label>
<button aria-haspopup="listbox" class="w-full bg-white border border-surface-border rounded-xl px-4 py-3 text-sm font-medium text-content-primary flex items-center justify-between focus:outline-none focus:border-brand-coral transition" id="input-mapel" type="button">
<span>Matematika</span>
<span class="material-symbols-outlined text-content-secondary text-xl">expand_more</span>
</button>
</div>
<!-- Upload File Area -->
<div data-purpose="upload-dropzone">
<label class="block text-xs font-semibold text-content-primary mb-1.5">
            Berkas Bank Soal
          </label>
<div class="border-2 border-dashed border-slate-300 bg-[#F8FAFC] rounded-2xl p-5 flex flex-col items-center justify-center text-center cursor-pointer hover:bg-slate-100/60 hover:border-brand-coral/60 transition group">
<!-- PDF Upload Icon Badge -->
<div class="w-12 h-12 rounded-full bg-red-50 text-red-500 flex items-center justify-center mb-2.5 group-hover:scale-105 transition-transform duration-200">
<span class="material-symbols-outlined text-2xl fill">picture_as_pdf</span>
</div>
<p class="text-sm font-semibold text-content-primary">Pilih file PDF</p>
<p class="text-[11px] text-content-secondary mt-0.5">Hanya PDF • Maks. 10 MB</p>
</div>
</div>
<!-- Information Notice Banner -->
<aside class="bg-[#EFF6FF] border border-[#BFDBFE] rounded-xl p-3 flex items-start gap-2.5 text-xs text-[#1E40AF]" data-purpose="info-banner">
<span class="material-symbols-outlined text-brand-ocean text-lg shrink-0 mt-0.5">info</span>
<span class="leading-snug font-medium">Bank soal hanya dapat dilihat oleh siswa kelas 12</span>
</aside>
</main>
<!-- END: FormContentScrollArea -->
<!-- BEGIN: BottomActionsAndHomeIndicator -->
<!-- Fixed Bottom Action Controls with iOS Home Indicator Bar -->
<footer class="px-5 pt-3 pb-2 bg-surface-bg border-t border-slate-100 flex flex-col gap-3" data-purpose="form-actions">
<!-- Dual Side-by-Side Action Buttons -->
<div class="flex items-center gap-3">
<!-- Batal (Secondary Outlined Button) -->
<button class="flex-1 py-3.5 rounded-xl border border-slate-300 bg-white text-sm font-semibold text-content-secondary hover:bg-slate-50 transition active:scale-[0.98] text-center" type="button">
            Batal
          </button>
<!-- Unggah (Primary Coral Button) -->
<button class="flex-1 py-3.5 rounded-xl bg-brand-coral hover:bg-brand-coralHover text-sm font-semibold text-white shadow-sm transition active:scale-[0.98] text-center flex items-center justify-center gap-1.5" type="button">
<span class="material-symbols-outlined text-base">cloud_upload</span>
<span>Unggah</span>
</button>
</div>
<!-- iOS Bottom Home Indicator Bar -->
<div class="w-32 h-1 bg-slate-900 rounded-full mx-auto mb-1 opacity-90" data-purpose="home-indicator"></div>
</footer>
<!-- END: BottomActionsAndHomeIndicator -->
</div>
<!-- END: SmartphoneInnerDisplay -->
</div>
<!-- END: PhoneFrameWrapper -->
</body></html>
