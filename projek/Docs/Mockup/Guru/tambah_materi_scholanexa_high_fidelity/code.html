<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ScholaNexa - Tambah Materi</title>
<!-- Google Font: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS v3 with forms & container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              coral: '#FF7F50',
              yellow: '#FFD166',
              mint: '#06D6A0',
              ocean: '#118AB2',
              dark: '#172033',
              text: '#191C1F',
              muted: '#626B78',
              border: '#E5E9F0',
              bg: '#F7F9FC'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style data-purpose="base-styling">
    body {
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Inter', sans-serif;
    }
    /* Hide default form outlines for custom focus states */
    input:focus, select:focus, textarea:focus {
      outline: none !important;
      box-shadow: 0 0 0 2px rgba(255, 127, 80, 0.25) !important;
      border-color: #FF7F50 !important;
    }
  </style>
</head>
<body class="p-4 sm:p-8 antialiased selection:bg-[#FF7F50] selection:text-white">
<!-- BEGIN: PhoneChassis -->
<div class="relative w-[390px] h-[844px] bg-[#F7F9FC] rounded-[44px] shadow-2xl border-[9px] border-[#172033] flex flex-col overflow-hidden text-[#191C1F]" data-purpose="device-chassis">
<!-- BEGIN: DynamicIslandAndCamera -->
<div class="absolute top-3 left-1/2 -translate-x-1/2 w-[112px] h-[29px] bg-black rounded-full z-50 flex items-center justify-between px-3 pointer-events-none" data-purpose="dynamic-island">
<div class="w-3 h-3 rounded-full bg-[#0d141e]/90 ml-0.5"></div>
<div class="w-2.5 h-2.5 rounded-full bg-[#1e293b]/70 flex items-center justify-center">
<div class="w-1 h-1 rounded-full bg-[#06D6A0]/40"></div>
</div>
</div>
<!-- END: DynamicIslandAndCamera -->
<!-- BEGIN: StatusBar -->
<header class="relative z-40 w-full pt-3.5 px-7 flex justify-between items-center text-xs font-semibold select-none text-[#191C1F]" data-purpose="status-bar">
<!-- Time indicator -->
<span class="tracking-tight text-[13px] font-bold pl-1">09:41</span>
<!-- Signal, Wifi, Battery indicators -->
<div class="flex items-center gap-1.5 pr-1">
<!-- Cellular Signal -->
<svg class="w-4 h-3.5 fill-current" fill="none" viewbox="0 0 17 12" xmlns="http://www.w3.org/2000/svg">
<rect height="4" rx="0.75" width="3" x="0" y="8"></rect>
<rect height="6.5" rx="0.75" width="3" x="4.5" y="5.5"></rect>
<rect height="9" rx="0.75" width="3" x="9" y="3"></rect>
<rect height="12" rx="0.75" width="3" x="13.5" y="0"></rect>
</svg>
<!-- Wifi Icon -->
<svg class="w-3.5 h-3.5 fill-current" fill="none" viewbox="0 0 16 12" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M8 2.25C10.74 2.25 13.23 3.32 15.08 5.07L15.93 4.2C13.86 2.24 11.07 1.05 8 1.05C4.93 1.05 2.14 2.24 0.07 4.2L0.92 5.07C2.77 3.32 5.26 2.25 8 2.25ZM8 5.85C9.8 5.85 11.44 6.57 12.65 7.73L13.5 6.86C12.08 5.5 10.15 4.65 8 4.65C5.85 4.65 3.92 5.5 2.5 6.86L3.35 7.73C4.56 6.57 6.2 5.85 8 5.85ZM8 9.45C9.02 9.45 9.94 9.87 10.62 10.54L8 13.2L5.38 10.54C6.06 9.87 6.98 9.45 8 9.45Z" fill-rule="evenodd"></path>
</svg>
<!-- Battery Icon -->
<div class="relative w-6 h-3 rounded-[3.5px] border border-[#191C1F] p-[1.5px] flex items-center">
<div class="w-full h-full bg-[#191C1F] rounded-[1.5px]"></div>
<div class="absolute -right-1 top-1 w-0.5 h-1 bg-[#191C1F] rounded-r-xs"></div>
</div>
</div>
</header>
<!-- END: StatusBar -->
<!-- BEGIN: TopAppBar -->
<section class="px-5 pt-3 pb-2 flex items-center gap-3" data-purpose="app-bar">
<!-- Back Button -->
<button aria-label="Kembali" class="w-10 h-10 rounded-xl bg-white border border-[#E5E9F0] flex items-center justify-center text-[#191C1F] hover:bg-slate-50 transition-colors shadow-xs" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24">
<path d="M15 18l-6-6 6-6"></path>
</svg>
</button>
<!-- Page Title -->
<h1 class="text-xl font-bold tracking-tight text-[#191C1F]">Tambah Materi</h1>
</section>
<!-- END: TopAppBar -->
<!-- BEGIN: FormContainer -->
<main class="flex-1 overflow-y-auto px-5 pt-2 pb-6 space-y-4 no-scrollbar" data-purpose="form-content">
<!-- Field 1: Judul Materi -->
<div class="space-y-1.5" data-purpose="input-title">
<label class="block text-sm font-semibold text-[#191C1F]" for="material-title">
          Judul Materi
        </label>
<div class="relative">
<input class="w-full bg-white border border-[#E5E9F0] rounded-xl px-4 py-2.5 text-sm text-[#191C1F] placeholder-[#626B78]/70 shadow-xs focus:ring-0 transition" id="material-title" name="title" placeholder="Contoh: Turunan dan Integral" type="text" value="Turunan dan Integral"/>
</div>
</div>
<!-- Field 2: Mata Pelajaran (Dropdown) -->
<div class="space-y-1.5" data-purpose="select-subject">
<label class="block text-sm font-semibold text-[#191C1F]" for="material-subject">
          Mata Pelajaran
        </label>
<div class="relative">
<select class="appearance-none w-full bg-white border border-[#E5E9F0] rounded-xl px-4 py-2.5 text-sm font-medium text-[#191C1F] shadow-xs cursor-pointer focus:ring-0 transition pr-10" id="material-subject" name="subject">
<option selected="" value="matematika">Matematika</option>
<option value="fisika">Fisika</option>
<option value="kimia">Kimia</option>
<option value="biologi">Biologi</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3.5 text-[#626B78]">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24">
<path d="M19 9l-7 7-7-7"></path>
</svg>
</div>
</div>
</div>
<!-- Field 3: Kelas (Dropdown) -->
<div class="space-y-1.5" data-purpose="select-class">
<label class="block text-sm font-semibold text-[#191C1F]" for="material-grade">
          Kelas
        </label>
<div class="relative">
<select class="appearance-none w-full bg-white border border-[#E5E9F0] rounded-xl px-4 py-2.5 text-sm font-medium text-[#191C1F] shadow-xs cursor-pointer focus:ring-0 transition pr-10" id="material-grade" name="grade">
<option selected="" value="xii-ipa-2">XII IPA 2</option>
<option value="xii-ipa-1">XII IPA 1</option>
<option value="xi-ipa-1">XI IPA 1</option>
<option value="x-mipa">X MIPA</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3.5 text-[#626B78]">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24">
<path d="M19 9l-7 7-7-7"></path>
</svg>
</div>
</div>
</div>
<!-- Field 4: Deskripsi -->
<div class="space-y-1.5" data-purpose="input-description">
<label class="block text-sm font-semibold text-[#191C1F]" for="material-desc">
          Deskripsi
        </label>
<textarea class="w-full bg-white border border-[#E5E9F0] rounded-xl p-3.5 text-sm text-[#191C1F] placeholder-[#626B78]/70 shadow-xs resize-none focus:ring-0 transition leading-relaxed" id="material-desc" name="description" placeholder="Tulis penjelasan singkat materi" rows="3">Modul ini membahas konsep dasar turunan fungsi aljabar, aturan rantai, serta penerapannya dalam menentukan gradien garis singgung.</textarea>
</div>
<!-- Field 5: Upload Area (Dashed Box) -->
<div class="space-y-1.5 pt-1" data-purpose="file-upload">
<label class="block text-sm font-semibold text-[#191C1F]">
          File Lampiran
        </label>
<div class="w-full bg-[#FFFFFF] border-2 border-dashed border-[#CBD5E1] rounded-2xl p-5 flex flex-col items-center justify-center text-center cursor-pointer hover:border-[#FF7F50] hover:bg-[#FFF7F4]/40 transition group">
<!-- Circular Upload Icon -->
<div class="w-12 h-12 rounded-full bg-[#FFF0EB] text-[#FF7F50] flex items-center justify-center mb-2.5 group-hover:scale-105 transition-transform">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M12 4v16m8-8H4"></path>
</svg>
</div>
<!-- Upload Label -->
<p class="text-sm font-semibold text-[#191C1F] mb-1">
            Pilih file lampiran
          </p>
<!-- Upload Helper Text -->
<p class="text-[11px] leading-tight text-[#626B78]">
            PDF, DOCX, JPG, PNG, atau ZIP • Maks. 10 MB
          </p>
</div>
</div>
</main>
<!-- END: FormContainer -->
<!-- BEGIN: BottomActions -->
<footer class="p-5 pt-3 bg-[#F7F9FC] border-t border-[#E5E9F0]/80" data-purpose="bottom-buttons">
<div class="flex items-center gap-3">
<!-- Secondary Action: Batal -->
<button class="flex-1 h-12 bg-white border border-[#E5E9F0] text-[#191C1F] text-sm font-semibold rounded-xl flex items-center justify-center hover:bg-slate-50 transition active:scale-[0.98]" type="button">
          Batal
        </button>
<!-- Primary Action: Simpan -->
<button class="flex-1 h-12 bg-[#FF7F50] text-white text-sm font-semibold rounded-xl flex items-center justify-center shadow-lg shadow-[#FF7F50]/25 hover:bg-[#f36f3e] transition active:scale-[0.98]" type="button">
          Simpan
        </button>
</div>
<!-- Home Indicator -->
<div class="w-full flex justify-center pt-4 pb-0.5">
<div class="w-32 h-1 bg-[#172033]/30 rounded-full"></div>
</div>
</footer>
<!-- END: BottomActions -->
</div>
<!-- END: PhoneChassis -->
</body></html>
