<!DOCTYPE html>

    tailwind.config = {

              blue: '#118AB2',

<body class="bg-slate-100 min-h-screen flex items-center justify-center p-0 md:p-6 font-sans antialiased text-content-primary selection:bg-brand-coral/20">

<!-- Outer Smartphone iOS Chassis (390px x 844px visual standard) -->
<div class="relative w-[390px] h-[844px] bg-surface-bg rounded-[50px] shadow-2xl border-[10px] border-content-navy flex flex-col overflow-hidden ring-1 ring-black/10 select-none">

<header class="relative w-full pt-3 px-7 z-40 bg-surface-bg flex items-center justify-between shrink-0">

<span class="text-[14px] font-semibold tracking-tight text-content-primary">09:41</span>

<div aria-hidden="true" class="absolute left-1/2 -translate-x-1/2 top-2.5 w-[116px] h-[28px] bg-black rounded-full flex items-center justify-end pr-3 gap-1.5 shadow-sm">

<div class="w-2.5 h-2.5 rounded-full bg-blue-950/80 ring-1 ring-blue-900/40"></div>
</div>
<!-- iOS Status Bar Icons (Signal, Wifi, Battery) -->
<div aria-label="Status Sinyal dan Baterai" class="flex items-center space-x-1.5 text-content-primary">

<path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9zm0 2c3.87 0 7 3.13 7 7 0 1.54-.5 2.97-1.35 4.14L12 19.68l-5.65-3.54C5.5 14.97 5 13.54 5 12c0-3.87 3.13-7 7-7z" opacity="0.1"></path>
<rect height="6" rx="0.8" width="3" x="3" y="14"></rect>
<rect height="9" rx="0.8" width="3" x="8" y="11"></rect>
<rect height="12" rx="0.8" width="3" x="13" y="8"></rect>
<rect height="15" rx="0.8" width="3" x="18" y="5"></rect>
</svg>
<!-- Wifi -->
<svg class="w-4 h-4 stroke-current fill-none stroke-2 stroke-linecap-round stroke-linejoin-round" viewbox="0 0 24 24">
<path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
<path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
<path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
<circle cx="12" cy="20" fill="currentColor" r="1"></circle>
</svg>
<!-- Battery -->
<div class="flex items-center">
<div class="w-5 h-2.5 border border-content-primary rounded-[3px] p-0.5 flex items-center">
<div class="h-full w-full bg-content-primary rounded-[1px]"></div>
</div>
<div class="w-0.5 h-1 bg-content-primary rounded-r-[1px] ml-[0.5px]"></div>
</div>

<!-- END: DeviceStatusAndIslandBar -->
<!-- BEGIN: TopAppBar -->
<section class="w-full px-5 pt-3 pb-2 flex items-center justify-between shrink-0 bg-surface-bg z-20">

<button aria-label="Kembali" class="w-10 h-10 rounded-xl bg-surface border border-content-border flex items-center justify-center text-content-primary active:scale-95 transition-transform shadow-xs" type="button">
<svg class="w-5 h-5 stroke-current fill-none stroke-[2.2] stroke-linecap-round stroke-linejoin-round" viewbox="0 0 24 24">
<path d="M15 18l-6-6 6-6"></path>

<h1 class="text-[20px] font-bold text-content-primary tracking-tight">Pembelajaran</h1>

<button class="relative pb-2.5 font-semibold text-brand-coral text-[15px] px-2 flex flex-col items-center" type="button">

<!-- Tab 2: Tugas -->
<button class="pb-2.5 font-medium text-content-secondary hover:text-content-primary text-[15px] px-2" type="button">

<button class="pb-2.5 font-medium text-content-secondary hover:text-content-primary text-[15px] px-2" type="button">
<span>Bank Soal</span>
</button>
</div>
</nav>
<!-- END: NavigationTabs -->
<!-- BEGIN: MainContentArea -->
<!-- Scrollable container for Search, Cards, and layout spacing -->
<main class="flex-1 overflow-y-auto px-5 pt-3.5 pb-24 no-scrollbar space-y-3.5">
<!-- BEGIN: SearchAndFilterBar -->
<div class="flex items-center gap-2.5" data-purpose="search-and-filter">
<!-- Search Input Field -->
<div class="relative flex-1">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-content-secondary">
<svg class="w-4 h-4 stroke-current fill-none stroke-2 stroke-linecap-round stroke-linejoin-round" viewbox="0 0 24 24">
<circle cx="11" cy="11" r="7"></circle>
<path d="M21 21l-4.35-4.35"></path>
</svg>
</div>
<input class="w-full h-11 pl-10 pr-3.5 bg-surface text-[14px] text-content-primary placeholder:text-content-secondary/70 border border-content-border rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-coral/30 focus:border-brand-coral shadow-xs" placeholder="Cari materi atau topik..." type="search"/>
</div>
<!-- Filter/Tune Button -->
<button aria-label="Filter dan Urutkan" class="w-11 h-11 bg-surface border border-content-border rounded-xl flex items-center justify-center text-content-secondary hover:text-content-primary active:scale-95 transition-transform shadow-xs shrink-0" type="button">
<svg class="w-5 h-5 stroke-current fill-none stroke-[2] stroke-linecap-round stroke-linejoin-round" viewbox="0 0 24 24">
<line x1="4" x2="20" y1="8" y2="8"></line>
<line x1="4" x2="20" y1="16" y2="16"></line>
</svg>

<path d="M12 20h9"></path>
<path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
