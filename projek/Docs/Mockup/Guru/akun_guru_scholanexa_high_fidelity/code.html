<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ScholaNexa - Profil Guru</title>
<!-- Tailwind CSS CDN with Forms & Container Queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              coral: '#FF7F50',
              yellow: '#FFD166',
              mint: '#06D6A0',
              ocean: '#118AB2',
              danger: '#EF476F',
            },
            surface: '#F7F9FC',
            textPrimary: '#191C1F',
            textSecondary: '#626B78',
            borderBase: '#E5E9F0',
          }
        }
      }
    }
  </script>
<!-- Custom CSS for Viewport & Material Icons Setup -->
<style data-purpose="base-styling">
    body {
      background-color: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 16px;
      font-family: 'Inter', sans-serif;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
      user-select: none;
    }
    .material-symbols-outlined.filled {
      font-variation-settings: 'FILL' 1, 'wght' 600, 'GRAD' 0, 'opsz' 24;
    }
    /* Hide scrollbars for clean app viewport preview */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body>
<!-- BEGIN: PhoneChassis -->
<div class="relative w-[390px] h-[844px] bg-[#172033] rounded-[48px] p-[10px] shadow-2xl ring-1 ring-slate-800/80 flex flex-col justify-between overflow-hidden select-none" data-purpose="phone-chassis">
<!-- Phone Inner Display Screen -->
<div class="relative w-full h-full bg-[#F7F9FC] rounded-[38px] overflow-hidden flex flex-col justify-between shadow-inner">
<!-- BEGIN: DynamicIsland & Notch -->
<div class="absolute top-[11px] left-1/2 -translate-x-1/2 w-[122px] h-[32px] bg-black rounded-full z-50 flex items-center justify-between px-3" data-purpose="dynamic-island">
<div class="w-2.5 h-2.5 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center">
<div class="w-1 h-1 rounded-full bg-blue-950/60"></div>
</div>
<div class="w-3 h-3 rounded-full bg-slate-950 flex items-center justify-center">
<div class="w-1.5 h-1.5 rounded-full bg-[#1e293b]/70"></div>
</div>
</div>
<!-- END: DynamicIsland & Notch -->
<!-- BEGIN: StatusBar -->
<header class="w-full pt-3 px-7 flex justify-between items-center z-40 text-xs font-semibold text-[#191C1F]" data-purpose="status-bar">
<!-- Time -->
<span class="tracking-tight text-[13px] font-medium pt-0.5">09:41</span>
<!-- Status Icons -->
<div class="flex items-center gap-1.5 text-slate-800">
<span class="material-symbols-outlined text-[15px]">signal_cellular_alt</span>
<span class="material-symbols-outlined text-[15px]">wifi</span>
<span class="material-symbols-outlined text-[17px] rotate-90 leading-none">battery_full</span>
</div>
</header>
<!-- END: StatusBar -->
<!-- Scrollable Main Content -->
<div class="flex-1 overflow-y-auto no-scrollbar flex flex-col" data-purpose="screen-content">
<!-- BEGIN: AppHeader -->
<div class="w-full text-center py-3.5 border-b border-transparent" data-purpose="page-title-bar">
<h1 class="text-base font-bold text-[#191C1F] tracking-tight">Akun</h1>
</div>
<!-- END: AppHeader -->
<div class="px-5 pb-6 flex-1 flex flex-col justify-between">
<div>
<!-- BEGIN: ProfileHeader -->
<section class="flex flex-col items-center text-center mt-3" data-purpose="teacher-profile-header">
<!-- Avatar with Initials -->
<div class="relative group">
<div class="w-[88px] h-[88px] rounded-full bg-gradient-to-tr from-[#FFE5D9] via-[#FFD8C9] to-[#FFF0EB] border-2 border-white shadow-sm flex items-center justify-center text-brand-coral font-bold text-2xl tracking-wide">
                  SW
                </div>
<!-- Mini camera badge -->
<button class="absolute bottom-0 right-0 w-7 h-7 rounded-full bg-white shadow-md border border-slate-100 flex items-center justify-center text-slate-600 hover:text-brand-coral transition-colors" title="Ubah foto profil">
<span class="material-symbols-outlined text-[15px]">photo_camera</span>
</button>
</div>
<!-- Name & Credentials -->
<h2 class="text-lg font-bold text-[#191C1F] mt-3">Sari Wulandari, S.Pd.</h2>
<!-- Role Badge -->
<span class="inline-flex items-center mt-1 px-3 py-0.5 rounded-full text-xs font-semibold bg-orange-100/70 text-brand-coral">
                Guru Matematika
              </span>
<!-- NIP Identifier -->
<p class="text-xs text-[#626B78] font-normal mt-1.5 tracking-wide">
                NIP 198805122015
              </p>
</section>
<!-- END: ProfileHeader -->
<!-- BEGIN: AccountMenuSection -->
<section class="mt-7" data-purpose="account-options-list">
<!-- Two-Row Grouped Menu Card -->
<div class="bg-white rounded-2xl border border-[#E5E9F0] shadow-sm divide-y divide-[#F1F5F9] overflow-hidden">
<!-- Row 1: Ganti Email -->
<button class="w-full flex items-center justify-between px-4 py-3.5 hover:bg-slate-50 active:bg-slate-100 transition-colors text-left group">
<div class="flex items-center gap-3.5">
<div class="w-9 h-9 rounded-xl bg-sky-50 text-brand-ocean flex items-center justify-center group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<span class="text-sm font-medium text-[#191C1F]">Ganti Email</span>
</div>
<span class="material-symbols-outlined text-[#94A3B8] text-[20px]">chevron_right</span>
</button>
<!-- Row 2: Bantuan -->
<button class="w-full flex items-center justify-between px-4 py-3.5 hover:bg-slate-50 active:bg-slate-100 transition-colors text-left group">
<div class="flex items-center gap-3.5">
<div class="w-9 h-9 rounded-xl bg-amber-50 text-amber-500 flex items-center justify-center group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-[20px]">help_outline</span>
</div>
<span class="text-sm font-medium text-[#191C1F]">Bantuan</span>
</div>
<span class="material-symbols-outlined text-[#94A3B8] text-[20px]">chevron_right</span>
</button>
</div>
</section>
<!-- END: AccountMenuSection -->
</div>
<!-- BEGIN: ActionButtonsAndFooter -->
<div class="mt-8 mb-2" data-purpose="profile-actions-footer">
<!-- Logout Button -->
<button class="w-full py-3 px-4 rounded-xl border border-red-200 bg-red-50/70 hover:bg-red-100/60 active:bg-red-100 transition text-brand-danger font-semibold text-sm flex items-center justify-center gap-2 shadow-xs">
<span class="material-symbols-outlined text-[19px]">logout</span>
<span>Keluar</span>
</button>
<!-- Application Version -->
<p class="text-[11px] text-center text-[#94A3B8] mt-4 font-normal tracking-wide">
              ScholaNexa v1.0
            </p>
</div>
<!-- END: ActionButtonsAndFooter -->
</div>
</div>
<!-- BEGIN: BottomNavigationBar -->
<nav class="w-full bg-white border-t border-[#E5E9F0] px-2 pt-2 pb-1.5 flex justify-between items-center z-40" data-purpose="bottom-nav-bar">
<!-- Tab 1: Beranda -->
<a class="flex-1 flex flex-col items-center justify-center py-1 text-[#626B78] hover:text-[#191C1F] transition-colors" href="#">
<span class="material-symbols-outlined text-[22px]">home</span>
<span class="text-[10px] mt-0.5 font-medium tracking-tight">Beranda</span>
</a>
<!-- Tab 2: Jadwal -->
<a class="flex-1 flex flex-col items-center justify-center py-1 text-[#626B78] hover:text-[#191C1F] transition-colors" href="#">
<span class="material-symbols-outlined text-[22px]">calendar_month</span>
<span class="text-[10px] mt-0.5 font-medium tracking-tight">Jadwal</span>
</a>
<!-- Tab 3: Pembelajaran -->
<a class="flex-1 flex flex-col items-center justify-center py-1 text-[#626B78] hover:text-[#191C1F] transition-colors" href="#">
<span class="material-symbols-outlined text-[22px]">school</span>
<span class="text-[10px] mt-0.5 font-medium tracking-tight">Pembelajaran</span>
</a>
<!-- Tab 4: Nilai & Absensi -->
<a class="flex-1 flex flex-col items-center justify-center py-1 text-[#626B78] hover:text-[#191C1F] transition-colors" href="#">
<span class="material-symbols-outlined text-[22px]">fact_check</span>
<span class="text-[10px] mt-0.5 font-medium tracking-tight">Nilai &amp; Absen</span>
</a>
<!-- Tab 5: Akun (ACTIVE) -->
<a class="flex-1 flex flex-col items-center justify-center py-1 text-brand-coral relative" href="#">
<span class="material-symbols-outlined filled text-[22px]">person</span>
<span class="text-[10px] mt-0.5 font-bold tracking-tight">Akun</span>
<!-- Active Pill/Dot Indicator -->
<span class="w-1.5 h-1.5 rounded-full bg-brand-coral mt-0.5"></span>
</a>
</nav>
<!-- END: BottomNavigationBar -->
<!-- BEGIN: HomeIndicator -->
<div class="w-full bg-white pb-2 flex justify-center items-center z-40" data-purpose="home-indicator-container">
<div class="w-32 h-1 bg-slate-900/30 rounded-full"></div>
</div>
<!-- END: HomeIndicator -->
</div>
</div>
<!-- END: PhoneChassis -->
</body></html>
