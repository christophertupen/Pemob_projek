<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ScholaNexa - Ganti Email</title>
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'coral-primary': '#FF7F50',
            'ocean-blue': '#118AB2',
            'navy-dark': '#17212B',
            'screen-bg': '#F8F9FA'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style data-purpose="base-layout">
    body {
      background-color: #0f172a;
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
  </style>
</head>
<body class="antialiased">
<!-- BEGIN: PhoneDeviceFrame -->
<div class="relative w-[414px] h-[868px] bg-[#17212B] rounded-[52px] p-3 shadow-2xl ring-1 ring-white/10 flex flex-col items-center justify-center select-none" data-purpose="phone-chassis">
<!-- Viewport Container (390px x 844px) -->
<div class="relative w-[390px] h-[844px] bg-[#F8F9FA] rounded-[44px] overflow-hidden flex flex-col justify-between" data-purpose="mobile-viewport">
<!-- BEGIN: StatusBar -->
<div class="relative w-full h-11 pt-3 px-7 flex items-center justify-between z-20" data-purpose="ios-status-bar">
<!-- Clock -->
<span class="text-[14px] font-semibold text-[#17212B] tracking-tight">09:41</span>
<!-- Dynamic Island -->
<div class="absolute left-1/2 -translate-x-1/2 top-2.5 w-28 h-7 bg-black rounded-full flex items-center justify-end pr-2.5 space-x-1">
<div class="w-2.5 h-2.5 bg-neutral-900 rounded-full"></div>
</div>
<!-- System Status Icons -->
<div class="flex items-center space-x-1.5 text-[#17212B]">
<!-- Cellular Signal -->
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M2 17h3v4H2v-4zm5-5h3v9H7v-9zm5-5h3v14h-3V7zm5-5h3v19h-3V2z"></path>
</svg>
<!-- Wifi -->
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.32c3.78 0 7.22 1.48 9.77 3.93L12 19.06 2.23 11.25C4.78 8.8 8.22 7.32 12 7.32z"></path>
</svg>
<!-- Battery -->
<div class="w-5 h-2.5 border border-[#17212B] rounded-sm p-0.5 flex items-center">
<div class="h-full w-3 bg-[#17212B] rounded-2xs"></div>
</div>
</div>
</div>
<!-- END: StatusBar -->
<!-- Scrollable Main Content Container -->
<main class="flex-1 overflow-y-auto px-5 pt-3 pb-6 flex flex-col justify-between" data-purpose="screen-content">
<!-- Top Section Elements -->
<div class="flex flex-col">
<!-- BEGIN: HeaderNav -->
<header class="flex items-center gap-3.5 mb-6" data-purpose="app-header">
<!-- Back Button -->
<button aria-label="Kembali" class="w-10 h-10 rounded-xl bg-white border border-slate-200/90 shadow-xs flex items-center justify-center text-[#17212B] active:bg-slate-100 transition-colors" type="button">
<svg class="w-5 h-5 stroke-[2.2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15.75 19.5L8.25 12l7.5-7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<h1 class="text-xl font-bold tracking-tight text-[#17212B]">Ganti Email</h1>
</header>
<!-- END: HeaderNav -->
<!-- BEGIN: CurrentEmailCard -->
<section class="mb-5" data-purpose="current-email-container">
<div class="w-full rounded-2xl bg-white border border-slate-200/80 p-4 shadow-sm">
<span class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-1">Email Saat Ini</span>
<div class="flex items-center justify-between">
<span class="text-base font-bold text-slate-800 tracking-tight">rizky.pratama@gmail.com</span>
<span class="inline-flex items-center text-xs font-medium text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-200/60">
<svg class="w-3.5 h-3.5 mr-1 text-emerald-500" fill="currentColor" viewbox="0 0 20 20">
<path clip-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" fill-rule="evenodd"></path>
</svg>
                  Aktif
                </span>
</div>
</div>
</section>
<!-- END: CurrentEmailCard -->
<!-- BEGIN: NewEmailForm -->
<section class="space-y-2 mb-5" data-purpose="new-email-form">
<label class="block text-sm font-semibold text-slate-700" for="new-email-input">Email Baru</label>
<div class="relative rounded-xl bg-white border border-slate-300 shadow-sm focus-within:border-[#FF7F50] focus-within:ring-2 focus-within:ring-[#FF7F50]/20 transition-all">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
</div>
<input class="w-full pl-10 pr-3.5 py-3.5 bg-transparent border-0 rounded-xl text-slate-800 text-sm placeholder-slate-400 focus:ring-0 focus:outline-none" id="new-email-input" placeholder="Masukkan email baru" type="email"/>
</div>
<!-- Contextual Help / Info Message -->
<div class="flex items-start gap-2 pt-1">
<svg class="w-4 h-4 text-slate-400 mt-0.5 shrink-0" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<p class="text-xs text-slate-500 leading-relaxed">
                Kami akan mengirim kode OTP ke email baru. Perubahan email akan aktif setelah kode berhasil diverifikasi.
              </p>
</div>
</section>
<!-- END: NewEmailForm -->
<!-- BEGIN: VerificationInstructionCard -->
<section data-purpose="verification-badge-card">
<div class="border-2 border-dashed border-slate-300 bg-slate-50/70 rounded-2xl p-4 flex items-center justify-between gap-3">
<!-- Left Icon -->
<div class="w-10 h-10 rounded-full bg-orange-100 flex items-center justify-center shrink-0 text-[#FF7F50]">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<!-- Content Description -->
<div class="flex-1 min-w-0">
<h2 class="text-sm font-bold text-slate-800 leading-tight">Verifikasi Email Baru</h2>
<p class="text-[11px] text-slate-500 mt-0.5 leading-snug">Kode OTP akan dikirim ke alamat email baru yang Anda masukkan</p>
</div>
<!-- OTP Pill Badge -->
<div class="shrink-0 px-2.5 py-1 rounded-full text-[11px] font-bold bg-[#FF7F50]/10 text-[#FF7F50] border border-[#FF7F50]/30 tracking-wide uppercase">
                OTP
              </div>
</div>
</section>
<!-- END: VerificationInstructionCard -->
</div>
<!-- BEGIN: ActionButtonsGroup -->
<footer class="pt-6 pb-2 w-full space-y-2.5" data-purpose="footer-action-buttons">
<!-- Primary CTA Button -->
<button class="w-full h-12 rounded-xl font-semibold text-white bg-[#FF7F50] hover:bg-[#ff6f3c] active:scale-[0.99] shadow-md shadow-orange-500/20 transition-all flex items-center justify-center gap-2" type="button">
<span>Kirim Kode OTP</span>
<svg class="w-4 h-4 stroke-[2.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Secondary CTA Button -->
<button class="w-full h-12 rounded-xl font-semibold border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 active:bg-slate-100 transition-colors flex items-center justify-center" type="button">
            Batal
          </button>
</footer>
<!-- END: ActionButtonsGroup -->
</main>
<!-- BEGIN: HomeIndicator -->
<div class="w-full flex justify-center pb-2 pt-1 bg-transparent" data-purpose="ios-home-indicator">
<div class="w-32 h-1 bg-slate-900 rounded-full"></div>
</div>
<!-- END: HomeIndicator -->
</div>
</div>
<!-- END: PhoneDeviceFrame -->
</body></html>
