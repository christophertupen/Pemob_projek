<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Akun - ScholaNexa High Fidelity</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Inter & Material Symbols Outlined -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style data-purpose="custom-config">
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b1118;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .material-symbols-outlined.fill-active {
      font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body class="p-0 sm:p-6 select-none">
<!-- BEGIN: PhoneFrame -->
<div class="relative w-[390px] h-[844px] bg-[#F8F9FA] rounded-[48px] overflow-hidden shadow-2xl border-[10px] border-[#17212B] flex flex-col justify-between" data-purpose="mobile-viewport">
<!-- BEGIN: StatusBar & DynamicIsland -->
<header class="relative w-full pt-3 px-6 pb-2 z-50 flex items-center justify-between">
<!-- iOS Clock Time -->
<span class="text-sm font-semibold text-[#17212B] tracking-tight pl-2">09:41</span>
<!-- Dynamic Island Pill -->
<div class="absolute left-1/2 -translate-x-1/2 top-2.5 w-28 h-7 bg-black rounded-full shadow-inner flex items-center justify-end pr-2.5 gap-1.5" data-purpose="dynamic-island">
<span class="w-2.5 h-2.5 rounded-full bg-[#10141d]/80 border border-neutral-800"></span>
</div>
<!-- Status Bar Icons -->
<div class="flex items-center gap-1.5 pr-2 text-[#17212B]">
<!-- Cellular Icon -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 17 12">
<rect height="3" rx="0.5" width="2.5" x="0" y="9"></rect>
<rect height="5.5" rx="0.5" width="2.5" x="4" y="6.5"></rect>
<rect height="8" rx="0.5" width="2.5" x="8" y="4"></rect>
<rect height="11" rx="0.5" width="2.5" x="12" y="1"></rect>
</svg>
<!-- Wi-Fi Icon -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 16 12">
<path d="M8 2.8c2.4 0 4.6.9 6.2 2.5l1.4-1.4C13.7 1.9 11 1 8 1 5 1 2.3 1.9.4 3.9l1.4 1.4C3.4 3.7 5.6 2.8 8 2.8zm0 4c1.3 0 2.5.5 3.4 1.4L12.8 6.8C11.5 5.6 9.8 4.8 8 4.8s-3.5.8-4.8 2l1.4 1.4C5.5 7.3 6.7 6.8 8 6.8zm0 4a1.4 1.4 0 100-2.8 1.4 1.4 0 000 2.8z"></path>
</svg>
<!-- Battery Icon -->
<svg class="w-5 h-3 fill-current ml-0.5" viewbox="0 0 22 11">
<rect fill="none" height="10" rx="2.5" stroke="currentColor" stroke-width="1" width="18" x="0.5" y="0.5"></rect>
<rect height="7" rx="1.5" width="13" x="2" y="2"></rect>
<path d="M20 3.5c.8 0 1.2.7 1.2 1.5v2c0 .8-.4 1.5-1.2 1.5v-5z"></path>
</svg>
</div>
</header>
<!-- END: StatusBar & DynamicIsland -->
<!-- BEGIN: MainContent -->
<main class="flex-1 overflow-y-auto px-5 pt-3 pb-3 flex flex-col justify-between" data-purpose="scrollable-content">
<div>
<!-- Top App Bar -->
<section class="flex items-center justify-between mb-5" data-purpose="top-app-bar">
<h1 class="text-2xl font-bold text-[#17212B] tracking-tight">Akun</h1>
<button aria-label="Pengaturan" class="w-9 h-9 rounded-full bg-white border border-slate-200/80 shadow-xs flex items-center justify-center text-slate-600 hover:bg-slate-50 transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">settings</span>
</button>
</section>
<!-- Profile Section -->
<section class="flex flex-col items-center justify-center mb-6" data-purpose="profile-section">
<!-- Circular Avatar with User Initials -->
<div class="relative w-24 h-24 rounded-full bg-gradient-to-tr from-orange-100 to-amber-100 border-2 border-orange-200/70 flex items-center justify-center shadow-sm mb-3">
<span class="text-2xl font-bold text-[#FF7F50] tracking-wide">RP</span>
<!-- Online status indicator badge -->
<span class="absolute bottom-1 right-1 w-4 h-4 rounded-full bg-[#06D6A0] border-2 border-white"></span>
</div>
<!-- User Name and Student Subtitle -->
<h2 class="text-xl font-bold text-[#17212B] leading-tight text-center">Rizky Pratama</h2>
<p class="text-xs font-semibold text-slate-400 mt-1 tracking-wide uppercase">XII IPA 2 • NIS 2024001</p>
</section>
<!-- Grouped Menu Card -->
<section class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden" data-purpose="menu-card">
<div class="divide-y divide-slate-100">
<!-- Row 1: Ganti Email -->
<a class="w-full flex items-center justify-between p-3.5 hover:bg-slate-50/70 transition-colors" href="#email">
<div class="flex items-center gap-3.5">
<div class="w-10 h-10 rounded-full bg-orange-50 text-[#FF7F50] flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[22px]">mail</span>
</div>
<span class="font-semibold text-[#17212B] text-sm">Ganti Email</span>
</div>
<span class="material-symbols-outlined text-slate-400 text-[20px]">chevron_right</span>
</a>
<!-- Row 2: Absensi -->
<a class="w-full flex items-center justify-between p-3.5 hover:bg-slate-50/70 transition-colors" href="#absensi">
<div class="flex items-center gap-3.5">
<div class="w-10 h-10 rounded-full bg-emerald-50 text-[#06D6A0] flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[22px]">fact_check</span>
</div>
<span class="font-semibold text-[#17212B] text-sm">Absensi</span>
</div>
<span class="material-symbols-outlined text-slate-400 text-[20px]">chevron_right</span>
</a>
<!-- Row 3: Bank Soal -->
<a class="w-full flex items-center justify-between p-3.5 hover:bg-slate-50/70 transition-colors" href="#bank-soal">
<div class="flex items-center gap-3.5">
<div class="w-10 h-10 rounded-full bg-blue-50 text-[#118AB2] flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[22px]">quiz</span>
</div>
<span class="font-semibold text-[#17212B] text-sm">Bank Soal</span>
</div>
<span class="material-symbols-outlined text-slate-400 text-[20px]">chevron_right</span>
</a>
<!-- Row 4: Bantuan -->
<a class="w-full flex items-center justify-between p-3.5 hover:bg-slate-50/70 transition-colors" href="#bantuan">
<div class="flex items-center gap-3.5">
<div class="w-10 h-10 rounded-full bg-amber-50 text-[#D97706] flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[22px]">help</span>
</div>
<span class="font-semibold text-[#17212B] text-sm">Bantuan</span>
</div>
<span class="material-symbols-outlined text-slate-400 text-[20px]">chevron_right</span>
</a>
</div>
</section>
</div>
<!-- Logout Action & Version Info -->
<section class="mt-6 mb-2" data-purpose="logout-section">
<button class="w-full border border-rose-200/90 bg-rose-50/60 hover:bg-rose-100/60 active:scale-[0.99] text-rose-600 rounded-xl py-3 px-4 flex items-center justify-center gap-2 font-semibold text-sm transition-all shadow-sm" type="button">
<span class="material-symbols-outlined text-[20px] text-rose-600">logout</span>
<span>Keluar</span>
</button>
<p class="text-[11px] font-medium text-slate-400 text-center mt-2.5">ScholaNexa v1.0</p>
</section>
</main>
<!-- END: MainContent -->
<!-- BEGIN: BottomNavigation -->
<footer class="bg-white border-t border-slate-200/80 pt-2 pb-1 px-3 z-40" data-purpose="bottom-navigation">
<nav class="grid grid-cols-5 items-center">
<!-- Tab 1: Beranda -->
<a class="flex flex-col items-center justify-center py-1 text-slate-400 hover:text-slate-600 transition-colors" href="#beranda">
<span class="material-symbols-outlined text-[22px]">home</span>
<span class="text-[10px] font-medium mt-1">Beranda</span>
</a>
<!-- Tab 2: Jadwal -->
<a class="flex flex-col items-center justify-center py-1 text-slate-400 hover:text-slate-600 transition-colors" href="#jadwal">
<span class="material-symbols-outlined text-[22px]">calendar_today</span>
<span class="text-[10px] font-medium mt-1">Jadwal</span>
</a>
<!-- Tab 3: Belajar -->
<a class="flex flex-col items-center justify-center py-1 text-slate-400 hover:text-slate-600 transition-colors" href="#belajar">
<span class="material-symbols-outlined text-[22px]">menu_book</span>
<span class="text-[10px] font-medium mt-1">Belajar</span>
</a>
<!-- Tab 4: Nilai -->
<a class="flex flex-col items-center justify-center py-1 text-slate-400 hover:text-slate-600 transition-colors" href="#nilai">
<span class="material-symbols-outlined text-[22px]">bar_chart</span>
<span class="text-[10px] font-medium mt-1">Nilai</span>
</a>
<!-- Tab 5: Akun (ACTIVE) -->
<a class="flex flex-col items-center justify-center py-1 text-[#FF7F50] transition-colors relative" href="#akun">
<span class="material-symbols-outlined text-[22px] fill-active">person</span>
<span class="text-[10px] font-bold mt-1">Akun</span>
<!-- Active Pill Dot Indicator -->
<span class="w-1.5 h-1.5 bg-[#FF7F50] rounded-full mt-0.5"></span>
</a>
</nav>
<!-- Home Indicator Bar -->
<div class="pt-2 pb-1 flex justify-center items-center" data-purpose="home-indicator">
<div class="w-32 h-1 bg-slate-900 rounded-full"></div>
</div>
</footer>
<!-- END: BottomNavigation -->
</div>
<!-- END: PhoneFrame -->
</body></html>
