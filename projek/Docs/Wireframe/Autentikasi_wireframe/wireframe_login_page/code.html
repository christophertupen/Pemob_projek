<!-- Minimalist Phone Frame Canvas (390px x 844px target viewport) -->
<div class="relative w-full max-w-[390px] h-[844px] bg-white rounded-[44px] shadow-sm border border-neutral-900/90 flex flex-col justify-between p-5 overflow-hidden box-border">
<!-- Top Status Bar Area (Strictly geometric shapes, zero text/numbers) -->
<div class="w-full flex items-center justify-between pt-1 pb-2">
<!-- Left: Signal & Wifi abstract indicator bars -->
<div class="flex items-center gap-1.5 pl-2">
<span class="h-2 w-7 bg-neutral-400 rounded-full"></span>
<span class="h-2 w-3 bg-neutral-300 rounded-full"></span>
</div>
<!-- Center: Dynamic Island / Speaker Pill cutout -->
<div class="h-4 w-24 bg-neutral-900 rounded-full flex items-center justify-end pr-2">
<span class="h-2 w-2 rounded-full bg-neutral-800"></span>
</div>
<!-- Right: Battery & Network glyph representation -->
<div class="flex items-center gap-1.5 pr-2">
<span class="h-2 w-3 bg-neutral-300 rounded-full"></span>
<div class="w-6 h-3 rounded-[4px] border border-neutral-400 p-[1px] flex items-center">
<div class="h-full w-3/4 bg-neutral-400 rounded-[2px]"></div>
</div>
</div>
</div>
<!-- Main Content Flow (Ultra-minimal Wireframe Login) -->
<div class="flex-1 flex flex-col justify-center px-1">
<!-- Brand & Header Wireframe Section -->
<div class="flex flex-col items-center mb-8">
<!-- Logo wireframe box: increased size w-20 h-20 with geometric blueprint diagonal indicator -->
<div class="relative w-20 h-20 rounded-xl bg-neutral-100 border-2 border-neutral-400 overflow-hidden flex items-center justify-center">
<svg class="w-full h-full text-neutral-300 stroke-current" fill="none" viewBox="0 0 48 48">
<line stroke-width="1.5" x1="0" x2="48" y1="0" y2="48"></line>
<line stroke-width="1.5" x1="48" x2="0" y1="0" y2="48"></line>
</svg>
</div>
<!-- Headline text skeleton bar -->
<div class="h-5 w-48 bg-[#8E8E8E] rounded-full mt-5 mb-2.5"></div>
<!-- Subtitle text skeleton bar -->
<div class="h-3 w-64 max-w-full bg-[#C8C8C8] rounded-full"></div>
</div>
<!-- Form Elements Stack -->
<div class="flex flex-col gap-4">
<!-- Input Field 1 (Identifier/Email) -->
<div class="flex flex-col">
<!-- Label pill -->
<div class="h-2.5 w-20 bg-[#8E8E8E] rounded-full mb-2"></div>
<!-- Input Container -->
<div class="h-[50px] w-full bg-white rounded-xl border border-neutral-300 px-4 flex items-center">
<!-- Placeholder pill -->
<div class="h-3 w-36 bg-[#C8C8C8] rounded-full"></div>
</div>
</div>
<!-- Input Field 2 (Password / Secret) -->
<div class="flex flex-col">
<!-- Label pill -->
<div class="h-2.5 w-24 bg-[#8E8E8E] rounded-full mb-2"></div>
<!-- Input Container -->
<div class="h-[50px] w-full bg-white rounded-xl border border-neutral-300 px-4 flex items-center justify-between">
<!-- Value/Placeholder pill -->
<div class="h-3 w-28 bg-[#C8C8C8] rounded-full"></div>
<!-- Toggle Visibility Geometric Indicator -->
<div class="w-4 h-4 rounded-full border-[1.5px] border-neutral-400 flex items-center justify-center">
<div class="w-1.5 h-1.5 rounded-full bg-neutral-400"></div>
</div>
</div>
</div>
<!-- Secondary Action: Forgot Password representation -->
<div class="flex justify-end pt-0.5">
<div class="h-2.5 w-20 bg-[#8E8E8E] rounded-full"></div>
</div>
<!-- Primary Action Button: Full-width solid black with white pill inside -->
<div class="mt-4">
<button aria-label="Action" class="w-full h-[50px] bg-[#111111] hover:bg-neutral-800 active:scale-[0.99] transition-all rounded-xl flex items-center justify-center cursor-pointer border-0 p-0" type="button">
<span class="h-3 w-16 bg-white rounded-full"></span>
</button>
</div>
<!-- Secondary Inline Switch / Registration representation -->
<div class="flex items-center justify-center gap-2 pt-2">
<div class="h-2.5 w-28 bg-[#C8C8C8] rounded-full"></div>
<div class="h-2.5 w-14 bg-[#8E8E8E] rounded-full"></div>
</div>
</div>
</div>
<!-- Bottom Footer Note & Home Indicator Bar -->
<div class="w-full flex flex-col items-center gap-4 pb-1">
<!-- Centered footer legal / version representation -->
<div class="h-2 w-44 bg-[#C8C8C8] rounded-full"></div>
<!-- iOS / Android Home Indicator Pill -->
<div class="w-32 h-1 bg-neutral-900 rounded-full mb-0.5"></div>
</div>
</div>
</div></main>

</body></html>
