  </head><body class="bg-surface font-body-md text-on-surface antialiased flex flex-col min-h-screen"><main class="flex-1 flex flex-col relative w-full bg-surface pt-safe pb-safe px-margin"><div class="flex flex-col w-full items-center justify-center py-6">
<!-- Interactive Wireframe Canvas / Phone Frame Mockup -->
<div class="relative w-[390px] h-[844px] bg-[#FFFFFF] rounded-[44px] border-[1.5px] border-[#111111] overflow-hidden flex flex-col justify-between p-0 shadow-none select-none box-border">
<!-- Status Bar Area -->
<div class="relative w-full h-[48px] px-6 pt-3 flex items-center justify-between shrink-0">
<!-- Time Pill Skeleton (Left) -->
<div class="w-[38px] h-[12px] bg-[#8E8E8E] rounded-full"></div>
<!-- Dynamic Island (Center) -->
<div class="absolute left-1/2 -translate-x-1/2 top-3 w-[112px] h-[28px] bg-[#111111] rounded-full flex items-center justify-end px-3">
<!-- Minimal camera circle -->
<div class="w-[9px] h-[9px] bg-[#222222] rounded-full"></div>
</div>
<!-- System Icons Skeleton (Right: Signal, Wifi, Battery) -->
<div class="flex items-center gap-1.5">
<!-- Signal Bars Outline -->
<div class="flex items-end gap-[2px] h-[10px]">
<div class="w-[3px] h-[4px] bg-[#111111] rounded-[0.5px]"></div>
<div class="w-[3px] h-[6px] bg-[#111111] rounded-[0.5px]"></div>
<div class="w-[3px] h-[8px] bg-[#111111] rounded-[0.5px]"></div>
<div class="w-[3px] h-[10px] bg-[#111111] rounded-[0.5px]"></div>
</div>
<!-- Wifi Minimal Arc Representation -->
<div class="w-[12px] h-[10px] flex items-center justify-center">
<svg fill="none" height="10" viewbox="0 0 12 10" width="12">
<path d="M1 2.5C3.8 0.5 8.2 0.5 11 2.5" stroke="#111111" stroke-linecap="round" stroke-width="1.2"></path>
<path d="M3 5.5C4.8 4 7.2 4 9 5.5" stroke="#111111" stroke-linecap="round" stroke-width="1.2"></path>
<circle cx="6" cy="8.5" fill="#111111" r="1"></circle>
</svg>
</div>
<!-- Battery Pill Outline -->
<div class="w-[20px] h-[10px] border-[1.2px] border-[#111111] rounded-[3px] p-[1.5px] flex items-center">
<div class="w-[11px] h-full bg-[#111111] rounded-[1px]"></div>
</div>
</div>
</div>
<!-- Main Content Container inside Phone -->
<div class="flex-1 w-full px-4 pt-4 flex flex-col justify-between overflow-y-auto">
<div class="flex flex-col gap-6">
<!-- Header Row: Back button + Screen title bar -->
<div class="flex items-center gap-3 w-full">
<!-- Back Button -->
<button aria-label="Action" class="w-[38px] h-[38px] rounded-[8px] border-[1px] border-[#111111] bg-[#FFFFFF] flex items-center justify-center active:bg-[#ECEEF2] transition-colors shrink-0" id="btn-back" type="button">
<svg fill="none" height="16" viewbox="0 0 16 16" width="16">
<path d="M10 13L5 8L10 3" stroke="#111111" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
</button>
<!-- Dark Title Bar -->
<div class="w-[136px] h-[18px] bg-[#8E8E8E] rounded-full"></div>
</div>
<!-- Current Email Card -->
<div class="w-full bg-[#FFFFFF] border-[1px] border-[#E5E7EB] rounded-[12px] p-4 flex flex-col gap-2.5">
<!-- Label / Subtitle Bar -->
<div class="w-[68px] h-[10px] bg-[#C8C8C8] rounded-full"></div>
<!-- Current Email Address Bar -->
<div class="w-[184px] h-[14px] bg-[#8E8E8E] rounded-full"></div>
</div>
<!-- Input Field Section -->
<div class="flex flex-col gap-2">
<!-- Field Label Bar -->
<div class="w-[92px] h-[10px] bg-[#8E8E8E] rounded-full ml-0.5"></div>
<!-- Input Box -->
<div class="w-full h-[50px] bg-[#FFFFFF] border-[1px] border-[#D8DADE] rounded-[10px] px-3 flex items-center cursor-pointer transition-all" id="mock-input">
<!-- Short Gray Bar Placeholder inside -->
<div class="w-[120px] h-[12px] bg-[#C8C8C8] rounded-full transition-all" id="input-pill"></div>
</div>
</div>
<!-- Explanatory / Instruction Helper Note -->
<div class="flex flex-col gap-1.5 px-0.5">
<div class="w-[85%] h-[10px] bg-[#C8C8C8] rounded-full"></div>
<div class="w-[62%] h-[10px] bg-[#C8C8C8] rounded-full"></div>
</div>
<!-- Secondary Guidance / Status Skeleton Module -->
<div class="w-full border-[1px] border-dashed border-[#C8C8C8] rounded-[10px] p-3.5 flex items-center justify-between">
<div class="flex items-center gap-2.5">
<!-- Empty Circle Icon Skeleton -->
<div class="w-[18px] h-[18px] rounded-full border-[1.5px] border-[#8E8E8E] flex items-center justify-center">
<div class="w-[4px] h-[4px] bg-[#8E8E8E] rounded-full"></div>
</div>
<!-- Two-line descriptor -->
<div class="flex flex-col gap-1">
<div class="w-[104px] h-[10px] bg-[#8E8E8E] rounded-full"></div>
<div class="w-[72px] h-[8px] bg-[#C8C8C8] rounded-full"></div>
</div>
</div>
<!-- Status Pill Badge (Minimal, No text) -->
<div class="h-[22px] px-2.5 rounded-full border-[1px] border-[#8E8E8E] bg-[#FFFFFF] flex items-center justify-center">
<div class="w-[28px] h-[6px] bg-[#8E8E8E] rounded-full"></div>
</div>
</div>
</div>
<!-- Action Area pinned to bottom flow -->
<div class="w-full pb-4 pt-2 flex flex-col gap-2">
<!-- Primary Action Button -->
<button aria-label="Action" class="w-full h-[50px] bg-[#111111] rounded-[10px] flex items-center justify-center active:bg-[#374151] transition-transform active:scale-[0.99]" id="btn-primary" type="button">
<div class="w-[84px] h-[12px] bg-[#FFFFFF] rounded-full"></div>
</button>
<!-- Secondary Action Button -->
<button aria-label="Action" class="w-full h-[48px] bg-[#FFFFFF] border-[1px] border-[#111111] rounded-[10px] flex items-center justify-center active:bg-[#ECEEF2] transition-colors" id="btn-secondary" type="button">
<div class="w-[64px] h-[10px] bg-[#8E8E8E] rounded-full"></div>
</button>
</div>
</div>
<!-- Phone Bottom Home Indicator -->
<div class="w-full h-[28px] pb-2 flex items-center justify-center shrink-0">
<div class="w-[134px] h-[4.5px] bg-[#111111] rounded-full"></div>
</div>
</div>
</div>
<script>
  // Subtle interactive micro-feedback strictly preserving the wireframe constraints
  const mockInput = document.getElementById('mock-input');
  const inputPill = document.getElementById('input-pill');
  const btnPrimary = document.getElementById('btn-primary');

  if (mockInput && inputPill) {
    mockInput.addEventListener('click', () => {
      const isFocused = mockInput.classList.contains('border-[#111111]');
      if (!isFocused) {
        mockInput.classList.remove('border-[#D8DADE]');
        mockInput.classList.add('border-[#111111]', 'border-[1.5px]');
        inputPill.classList.remove('bg-[#C8C8C8]');
        inputPill.classList.add('bg-[#8E8E8E]');
      } else {
        mockInput.classList.remove('border-[#111111]', 'border-[1.5px]');
        mockInput.classList.add('border-[#D8DADE]');
        inputPill.classList.remove('bg-[#8E8E8E]');
        inputPill.classList.add('bg-[#C8C8C8]');
      }
    });
  }

  if (btnPrimary) {
    btnPrimary.addEventListener('click', () => {
      btnPrimary.classList.add('opacity-75');
      setTimeout(() => {
        btnPrimary.classList.remove('opacity-75');
      }, 150);
    });
  }
</script></main></body></html>
