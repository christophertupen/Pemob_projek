<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wireframe Jadwal Pelajaran (Ultra-Minimal Skeleton)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    /* Phone frame 390x844 */
    .phone-container {
      width: 390px;
      height: 844px;
      background: #ffffff;
      border: 1.5px solid #111111;
      border-radius: 46px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }
    .skeleton-bar-dark {
      background-color: #8E8E8E;
      border-radius: 9999px;
    }
    .skeleton-bar-light {
      background-color: #C8C8C8;
      border-radius: 9999px;
    }
    .card-outline {
      background-color: #ffffff;
      border: 1px solid #E5E7EB;
      border-radius: 12px;
    }
    .chip-outline {
      background-color: #ffffff;
      border: 1px solid #9CA3AF;
      border-radius: 9999px;
    }
    .chip-solid {
      background-color: #111111;
      border: 1px solid #111111;
      border-radius: 9999px;
    }
    /* Hide scrollbars */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body>

  <!-- Phone Mockup Container -->
  <div class="phone-container">
    
    <!-- Top System Bar / Notch Area -->
    <div class="pt-3 px-7 flex justify-between items-center z-10 shrink-0">
      <!-- Left time placeholder -->
      <div class="w-8 h-2.5 skeleton-bar-light"></div>
      
      <!-- Dynamic Island / Speaker cutout -->
      <div class="w-24 h-4 bg-[#111111] rounded-full"></div>
      
      <!-- Right status icons placeholder -->
      <div class="flex items-center gap-1.5">
        <div class="w-3 h-2 skeleton-bar-light"></div>
        <div class="w-2.5 h-2 skeleton-bar-light"></div>
        <div class="w-4 h-2.5 skeleton-bar-light"></div>
      </div>
    </div>

    <!-- Main Content Area -->
    <div class="flex-1 overflow-y-auto no-scrollbar px-4 pt-5 pb-4 flex flex-direction flex-col gap-5">
      
      <!-- Header / Title Bar Section -->
      <div class="flex items-center justify-between pt-1">
        <div class="w-40 h-5 skeleton-bar-dark"></div>
        <!-- Optional minimal geometric indicator (filter/calendar icon placeholder) -->
        <div class="w-8 h-8 rounded-lg border border-[#E5E7EB] flex items-center justify-center">
          <div class="w-3.5 h-3.5 rounded-full border border-[#8E8E8E]"></div>
        </div>
      </div>

      <!-- Row of Six Small Pill Chips (Days of the week) -->
      <!-- The 3rd is solid black (#111), the rest outlined -->
      <div class="flex items-center justify-between gap-1.5 pt-0.5">
        <!-- Chip 1 (Outlined) -->
        <div class="flex-1 h-8 chip-outline flex items-center justify-center">
          <div class="w-5 h-2 skeleton-bar-light"></div>
        </div>
        
        <!-- Chip 2 (Outlined) -->
        <div class="flex-1 h-8 chip-outline flex items-center justify-center">
          <div class="w-5 h-2 skeleton-bar-light"></div>
        </div>
        
        <!-- Chip 3 (Solid Black - Selected Day) -->
        <div class="flex-1 h-8 chip-solid flex items-center justify-center">
          <div class="w-5 h-2 bg-white rounded-full"></div>
        </div>
        
        <!-- Chip 4 (Outlined) -->
        <div class="flex-1 h-8 chip-outline flex items-center justify-center">
          <div class="w-5 h-2 skeleton-bar-light"></div>
        </div>
        
        <!-- Chip 5 (Outlined) -->
        <div class="flex-1 h-8 chip-outline flex items-center justify-center">
          <div class="w-5 h-2 skeleton-bar-light"></div>
        </div>
        
        <!-- Chip 6 (Outlined) -->
        <div class="flex-1 h-8 chip-outline flex items-center justify-center">
          <div class="w-5 h-2 skeleton-bar-light"></div>
        </div>
      </div>

      <!-- Date / Secondary Summary Indicator -->
      <div class="flex items-center justify-between px-0.5 -mt-1">
        <div class="w-28 h-2.5 skeleton-bar-light"></div>
        <div class="w-14 h-2 skeleton-bar-light"></div>
      </div>

      <!-- Four Lesson Cards -->
      <div class="flex flex-col gap-3">
        
        <!-- Lesson Card 1 -->
        <div class="card-outline p-4 flex items-center justify-between">
          <!-- Left: Two small stacked bars (Time range) -->
          <div class="w-16 flex flex-col gap-1.5 shrink-0">
            <div class="w-12 h-3 skeleton-bar-dark"></div>
            <div class="w-10 h-2 skeleton-bar-light"></div>
          </div>

          <!-- Divider line -->
          <div class="w-px h-9 bg-[#F3F4F6] mx-2"></div>

          <!-- Middle: Two bars (Subject, Teacher) -->
          <div class="flex-1 flex flex-col gap-1.5 pl-1">
            <div class="w-32 h-3.5 skeleton-bar-dark"></div>
            <div class="w-24 h-2.5 skeleton-bar-light"></div>
          </div>

          <!-- Right: Small light bar (Room badge / info) -->
          <div class="shrink-0 flex items-center pl-2">
            <div class="px-2 py-1 bg-[#F9FAFB] border border-[#E5E7EB] rounded-md">
              <div class="w-9 h-2.5 skeleton-bar-light"></div>
            </div>
          </div>
        </div>

        <!-- Lesson Card 2 -->
        <div class="card-outline p-4 flex items-center justify-between">
          <!-- Left: Two small stacked bars (Time range) -->
          <div class="w-16 flex flex-col gap-1.5 shrink-0">
            <div class="w-12 h-3 skeleton-bar-dark"></div>
            <div class="w-10 h-2 skeleton-bar-light"></div>
          </div>

          <!-- Divider line -->
          <div class="w-px h-9 bg-[#F3F4F6] mx-2"></div>

          <!-- Middle: Two bars (Subject, Teacher) -->
          <div class="flex-1 flex flex-col gap-1.5 pl-1">
            <div class="w-28 h-3.5 skeleton-bar-dark"></div>
            <div class="w-20 h-2.5 skeleton-bar-light"></div>
          </div>

          <!-- Right: Small light bar (Room badge / info) -->
          <div class="shrink-0 flex items-center pl-2">
            <div class="px-2 py-1 bg-[#F9FAFB] border border-[#E5E7EB] rounded-md">
              <div class="w-8 h-2.5 skeleton-bar-light"></div>
            </div>
          </div>
        </div>

        <!-- Lesson Card 3 -->
        <div class="card-outline p-4 flex items-center justify-between">
          <!-- Left: Two small stacked bars (Time range) -->
          <div class="w-16 flex flex-col gap-1.5 shrink-0">
            <div class="w-12 h-3 skeleton-bar-dark"></div>
            <div class="w-10 h-2 skeleton-bar-light"></div>
          </div>

          <!-- Divider line -->
          <div class="w-px h-9 bg-[#F3F4F6] mx-2"></div>

          <!-- Middle: Two bars (Subject, Teacher) -->
          <div class="flex-1 flex flex-col gap-1.5 pl-1">
            <div class="w-36 h-3.5 skeleton-bar-dark"></div>
            <div class="w-28 h-2.5 skeleton-bar-light"></div>
          </div>

          <!-- Right: Small light bar (Room badge / info) -->
          <div class="shrink-0 flex items-center pl-2">
            <div class="px-2 py-1 bg-[#F9FAFB] border border-[#E5E7EB] rounded-md">
              <div class="w-10 h-2.5 skeleton-bar-light"></div>
            </div>
          </div>
        </div>

        <!-- Lesson Card 4 -->
        <div class="card-outline p-4 flex items-center justify-between">
          <!-- Left: Two small stacked bars (Time range) -->
          <div class="w-16 flex flex-col gap-1.5 shrink-0">
            <div class="w-12 h-3 skeleton-bar-dark"></div>
            <div class="w-10 h-2 skeleton-bar-light"></div>
          </div>

          <!-- Divider line -->
          <div class="w-px h-9 bg-[#F3F4F6] mx-2"></div>

          <!-- Middle: Two bars (Subject, Teacher) -->
          <div class="flex-1 flex flex-col gap-1.5 pl-1">
            <div class="w-30 h-3.5 skeleton-bar-dark"></div>
            <div class="w-22 h-2.5 skeleton-bar-light"></div>
          </div>

          <!-- Right: Small light bar (Room badge / info) -->
          <div class="shrink-0 flex items-center pl-2">
            <div class="px-2 py-1 bg-[#F9FAFB] border border-[#E5E7EB] rounded-md">
              <div class="w-9 h-2.5 skeleton-bar-light"></div>
            </div>
          </div>
        </div>

      </div>

    </div>

    <!-- Bottom Navigation Bar -->
    <!-- 5 evenly spaced items (circle above short bar), 2nd black, the rest light gray -->
    <div class="border-t border-[#E5E7EB] bg-white pt-2.5 pb-5 px-3 flex justify-around items-center z-10 shrink-0">
      
      <!-- Nav Item 1 (Light Gray - Home) -->
      <div class="flex flex-col items-center gap-1.5 w-14">
        <div class="w-4 h-4 rounded-full border border-[#C8C8C8]"></div>
        <div class="w-5 h-1.5 skeleton-bar-light"></div>
      </div>

      <!-- Nav Item 2 (Solid Black - Active: Schedule) -->
      <div class="flex flex-col items-center gap-1.5 w-14">
        <div class="w-4 h-4 rounded-full bg-[#111111]"></div>
        <div class="w-6 h-1.5 bg-[#111111] rounded-full"></div>
      </div>

      <!-- Nav Item 3 (Light Gray - Tasks) -->
      <div class="flex flex-col items-center gap-1.5 w-14">
        <div class="w-4 h-4 rounded-full border border-[#C8C8C8]"></div>
        <div class="w-5 h-1.5 skeleton-bar-light"></div>
      </div>

      <!-- Nav Item 4 (Light Gray - Grades) -->
      <div class="flex flex-col items-center gap-1.5 w-14">
        <div class="w-4 h-4 rounded-full border border-[#C8C8C8]"></div>
        <div class="w-5 h-1.5 skeleton-bar-light"></div>
      </div>

      <!-- Nav Item 5 (Light Gray - Profile) -->
      <div class="flex flex-col items-center gap-1.5 w-14">
        <div class="w-4 h-4 rounded-full border border-[#C8C8C8]"></div>
        <div class="w-5 h-1.5 skeleton-bar-light"></div>
      </div>

    </div>

    <!-- Home Indicator Bar -->
    <div class="w-full flex justify-center pb-2 bg-white">
      <div class="w-32 h-1 bg-[#111111] rounded-full"></div>
    </div>

  </div>

</body>
</html>
