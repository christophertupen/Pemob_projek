  // Simple playful micro-interaction for payment option selection
  document.querySelectorAll('#payment-group .payment-option').forEach(option => {
    option.addEventListener('click', () => {
      document.querySelectorAll('#payment-group .payment-option').forEach(el => {
        el.dataset.active = 'false';
        el.classList.remove('border-2', 'border-primary');
        el.classList.add('border', 'border-outline-variant');
        
        const radio = el.querySelector('.radio-indicator');
        radio.classList.remove('border-primary');
        radio.classList.add('border-outline-variant');
        
        const dot = el.querySelector('.radio-dot');
        dot.classList.remove('bg-primary');
        dot.classList.add('bg-transparent');

        const chevron = el.querySelector('svg');
        chevron.classList.remove('text-on-surface');
        chevron.classList.add('text-outline');
      });

      option.dataset.active = 'true';
      option.classList.remove('border', 'border-outline-variant');
      option.classList.add('border-2', 'border-primary');
      
      const activeRadio = option.querySelector('.radio-indicator');
      activeRadio.classList.remove('border-outline-variant');
      activeRadio.classList.add('border-primary');
      
      const activeDot = option.querySelector('.radio-dot');
      activeDot.classList.remove('bg-transparent');
      activeDot.classList.add('bg-primary');

      const activeChevron = option.querySelector('svg');
      activeChevron.classList.remove('text-outline');
      activeChevron.classList.add('text-on-surface');
    });
  });
