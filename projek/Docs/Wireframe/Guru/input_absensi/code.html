<script>
  // Simple playful micro-interaction: Toggle selection between attendance chips per row
  document.querySelectorAll('[data-status-group]').forEach(group => {
    const buttons = group.querySelectorAll('button');
    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => {
          b.classList.remove('bg-primary');
          b.classList.add('bg-surface-container-high');
        });
        btn.classList.remove('bg-surface-container-high');
        btn.classList.add('bg-primary');
      });
    });
  });

  // Haptic-like button tap animation
  const saveBtn = document.getElementById('save-btn');
  if (saveBtn) {
    saveBtn.addEventListener('click', () => {
      saveBtn.classList.add('scale-95');
      setTimeout(() => {
        saveBtn.classList.remove('scale-95');
      }, 150);
    });
  }
