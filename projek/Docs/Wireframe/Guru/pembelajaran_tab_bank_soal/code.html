<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Wireframe Pembelajaran Guru - Bank Soal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
</head>
<body class="bg-white text-black min-h-screen flex justify-center antialiased m-0 p-0 font-sans select-none">
<!-- Native Mobile Viewport Container -->
<div class="w-full max-w-[390px] min-h-[844px] h-screen bg-white relative flex flex-col justify-between overflow-hidden">
<!-- Top Area: Status Bar & Header Content -->
<div class="w-full flex flex-col">
<!-- iOS Status Bar Area -->
<div class="pt-3 px-7 flex items-center justify-between z-10 w-full">
<!-- Status time skeleton -->
<div class="w-8 h-2.5 bg-[#8E8E8E] rounded-full"></div>
<!-- Dynamic Island / Sensor Notch -->
<div class="w-24 h-5 bg-black rounded-full"></div>
<!-- Status icons (signal dots, wifi, battery indicator) -->
<div class="flex items-center space-x-1.5">
<div class="w-3.5 h-2 bg-[#8E8E8E] rounded-xs"></div>
<div class="w-2.5 h-2.5 bg-[#8E8E8E] rounded-full"></div>
<div class="w-4 h-2 border border-[#8E8E8E] rounded-xs flex items-center p-0.5">
<div class="w-full h-full bg-[#8E8E8E] rounded-xs"></div>
</div>
</div>
</div>
<!-- Screen Header Bar (Dark gray pill title bar) -->
<div class="px-5 pt-5 pb-3">
<div class="w-36 h-4 bg-[#8E8E8E] rounded-full"></div>
</div>
<!-- 3-Tab Segment Row (Tab 1 light gray, Tab 2 light gray, Tab 3 active solid black) -->
<div class="px-5 pb-4">
<div class="flex border-b border-[#E5E7EB] relative">
<!-- Tab 1 (Inactive) -->
<div class="flex-1 py-2.5 flex justify-center items-center">
<div class="w-14 h-2 bg-[#C8C8C8] rounded-full"></div>
</div>
<!-- Tab 2 (Inactive) -->
<div class="flex-1 py-2.5 flex justify-center items-center">
<div class="w-14 h-2 bg-[#C8C8C8] rounded-full"></div>
</div>
<!-- Tab 3 (Active) -->
<div class="flex-1 py-2.5 flex justify-center items-center relative">
<div class="w-16 h-2 bg-[#111111] rounded-full"></div>
<!-- Active Tab Indicator Line -->
<div class="absolute bottom-0 inset-x-2 h-0.5 bg-[#111111] rounded-full"></div>
</div>
</div>
</div>
</div>
<!-- Content List: Exactly 4 Question Bank Cards -->
<div class="px-5 flex-1 space-y-3 overflow-y-auto">
<!-- Card 1 -->
<div class="bg-white border border-[#E5E7EB] rounded-xl p-3.5 flex items-center justify-between">
<div class="flex items-center space-x-3">
<!-- Document icon skeleton -->
<div class="w-10 h-10 bg-[#E5E7EB] rounded-lg flex items-center justify-center shrink-0">
<div class="w-4 h-4 border border-[#8E8E8E] rounded-xs"></div>
</div>
<!-- Stacked gray text skeleton bars -->
<div class="space-y-1.5">
<div class="w-32 h-2.5 bg-[#8E8E8E] rounded-full"></div>
<div class="w-24 h-2 bg-[#C8C8C8] rounded-full"></div>
<div class="w-16 h-2 bg-[#E5E7EB] rounded-full"></div>
</div>
</div>
<!-- Right Action Dots -->
<div class="flex items-center space-x-2">
<div class="w-2 h-2 rounded-full border border-[#8E8E8E]"></div>
<div class="w-2 h-2 rounded-full border border-[#8E8E8E]"></div>
</div>
</div>
<!-- Card 2 -->
<div class="bg-white border border-[#E5E7EB] rounded-xl p-3.5 flex items-center justify-between">
<div class="flex items-center space-x-3">
<div class="w-10 h-10 bg-[#E5E7EB] rounded-lg flex items-center justify-center shrink-0">
<div class="w-4 h-4 border border-[#8E8E8E] rounded-xs"></div>
</div>
<div class="space-y-1.5">
<div class="w-36 h-2.5 bg-[#8E8E8E] rounded-full"></div>
<div class="w-20 h-2 bg-[#C8C8C8] rounded-full"></div>
<div class="w-14 h-2 bg-[#E5E7EB] rounded-full"></div>
</div>
</div>
<div class="flex items-center space-x-2">
<div class="w-2 h-2 rounded-full border border-[#8E8E8E]"></div>
<div class="w-2 h-2 rounded-full border border-[#8E8E8E]"></div>
</div>
</div>
<!-- Card 3 -->
<div class="bg-white border border-[#E5E7EB] rounded-xl p-3.5 flex items-center justify-between">
<div class="flex items-center space-x-3">
<div class="w-10 h-10 bg-[#E5E7EB] rounded-lg flex items-center justify-center shrink-0">
<div class="w-4 h-4 border border-[#8E8E8E] rounded-xs"></div>
</div>
<div class="space-y-1.5">
<div class="w-28 h-2.5 bg-[#8E8E8E] rounded-full"></div>
<div class="w-24 h-2 bg-[#C8C8C8] rounded-full"></div>
<div class="w-16 h-2 bg-[#E5E7EB] rounded-full"></div>
</div>
</div>
<div class="flex items-center space-x-2">
<div class="w-2 h-2 rounded-full border border-[#8E8E8E]"></div>
<div class="w-2 h-2 rounded-full border border-[#8E8E8E]"></div>
</div>
</div>
<!-- Card 4 -->
<div class="bg-white border border-[#E5E7EB] rounded-xl p-3.5 flex items-center justify-between">
<div class="flex items-center space-x-3">
<div class="w-10 h-10 bg-[#E5E7EB] rounded-lg flex items-center justify-center shrink-0">
<div class="w-4 h-4 border border-[#8E8E8E] rounded-xs"></div>
</div>
<div class="space-y-1.5">
<div class="w-32 h-2.5 bg-[#8E8E8E] rounded-full"></div>
<div class="w-20 h-2 bg-[#C8C8C8] rounded-full"></div>
<div class="w-14 h-2 bg-[#E5E7EB] rounded-full"></div>
</div>
</div>
<div class="flex items-center space-x-2">
<div class="w-2 h-2 rounded-full border border-[#8E8E8E]"></div>
<div class="w-2 h-2 rounded-full border border-[#8E8E8E]"></div>
</div>
</div>
</div>
<!-- Floating Action Button (FAB: Solid black button with white plus icon) -->
<div class="absolute right-5 bottom-20 z-20">
<div class="w-[52px] h-[52px] bg-[#111111] rounded-full flex items-center justify-center cursor-pointer">
<svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2.5" viewbox="0 0 24 24">
<line x1="12" x2="12" y1="5" y2="19"></line>
<line x1="5" x2="19" y1="12" y2="12"></line>
</svg>
</div>
</div>
<!-- Bottom Navigation Bar & Home Indicator Area -->
<div class="w-full bg-white z-10 shrink-0">
<!-- 5-item Bottom Navigation Bar -->
<div class="border-t border-[#E5E7EB] pt-2.5 pb-2 px-3 flex justify-around items-center">
<!-- Item 1 (Light Gray) -->
<div class="flex flex-col items-center justify-center space-y-1 py-1">
<div class="w-[18px] h-[18px] rounded-full border border-[#C8C8C8] bg-transparent"></div>
<div class="w-5 h-1.5 bg-[#C8C8C8] rounded-full"></div>
</div>
<!-- Item 2 (Light Gray) -->
<div class="flex flex-col items-center justify-center space-y-1 py-1">
<div class="w-[18px] h-[18px] rounded-full border border-[#C8C8C8] bg-transparent"></div>
<div class="w-5 h-1.5 bg-[#C8C8C8] rounded-full"></div>
</div>
<!-- Item 3 (Active / Solid Black) -->
<div class="flex flex-col items-center justify-center space-y-1 py-1">
<div class="w-[18px] h-[18px] rounded-full bg-[#111111]"></div>
<div class="w-6 h-1.5 bg-[#111111] rounded-full"></div>
</div>
<!-- Item 4 (Light Gray) -->
<div class="flex flex-col items-center justify-center space-y-1 py-1">
<div class="w-[18px] h-[18px] rounded-full border border-[#C8C8C8] bg-transparent"></div>
<div class="w-5 h-1.5 bg-[#C8C8C8] rounded-full"></div>
</div>
<!-- Item 5 (Light Gray) -->
<div class="flex flex-col items-center justify-center space-y-1 py-1">
<div class="w-[18px] h-[18px] rounded-full border border-[#C8C8C8] bg-transparent"></div>
<div class="w-5 h-1.5 bg-[#C8C8C8] rounded-full"></div>
</div>
</div>
<!-- Home Indicator Bar -->
<div class="pb-2 pt-1 flex justify-center bg-white">
<div class="w-32 h-1 bg-black rounded-full"></div>
</div>
</div>
</div>
</body></html>
