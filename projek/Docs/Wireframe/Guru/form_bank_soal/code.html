<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wireframe Unggah Bank Soal Guru (Ultra-Minimal Skeleton)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Device Canvas Frame matching Tambah Materi / Tambah Tugas */
    .mobile-screen {
      width: 390px;
      height: 844px;
      background: #ffffff;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    /* Common Skeleton Elements */
    .skeleton-bar-dark {
      background-color: #8E8E8E;
      border-radius: 9999px;
    }
    .skeleton-bar-light {
      background-color: #C8C8C8;
      border-radius: 9999px;
    }
    .skeleton-bar-faint {
      background-color: #E2E2E2;
      border-radius: 9999px;
    }
  </style>
</head>
<body>

  <div class="mobile-screen border border-neutral-300">
    <!-- Status Bar (Dynamic Island & Phone Indicators) -->
    <div class="w-full pt-3 px-7 flex items-center justify-between z-20 shrink-0">
      <!-- Time pill dummy -->
      <div class="w-12 h-3.5 bg-[#8E8E8E] rounded-full"></div>
      
      <!-- Dynamic Island pill -->
      <div class="w-24 h-6 bg-black rounded-full mx-auto"></div>
      
      <!-- Right Status indicators (Signal, Wifi, Battery) -->
      <div class="flex items-center gap-1.5">
        <div class="w-3.5 h-2.5 bg-[#8E8E8E] rounded-[2px]"></div>
        <div class="w-2.5 h-2.5 bg-[#8E8E8E] rounded-full"></div>
        <div class="w-5 h-2.5 border border-[#8E8E8E] rounded-[3px] p-[1px] flex items-center">
          <div class="w-3 h-1.5 bg-[#8E8E8E] rounded-[1px]"></div>
        </div>
      </div>
    </div>

    <!-- Header Navigation Bar -->
    <div class="w-full px-4 pt-4 pb-3 flex items-center gap-3 shrink-0">
      <!-- Back button: rounded-square with chevron -->
      <div class="w-10 h-10 rounded-xl border border-neutral-300 flex items-center justify-center shrink-0">
        <svg class="w-5 h-5 text-neutral-800" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
      </div>

      <!-- Title Bar: darker gray bar (#8E8E8E) -->
      <div class="w-44 h-5 skeleton-bar-dark"></div>
    </div>

    <!-- Scrollable Content Area -->
    <div class="flex-1 overflow-y-auto px-4 pt-1 pb-4 flex flex-col gap-4">
      
      <!-- Field 1: Single Input Field (Judul / Nama Bank Soal) -->
      <div class="flex flex-col gap-2">
        <!-- Tiny label bar above -->
        <div class="w-20 h-2.5 skeleton-bar-dark"></div>
        <!-- Input field: white rounded rectangle with thin gray outline and short gray bar inside -->
        <div class="w-full h-12 bg-white rounded-xl border border-neutral-300 px-3.5 flex items-center">
          <div class="w-36 h-3 skeleton-bar-light"></div>
        </div>
      </div>

      <!-- Field 2: Tall Multiline Field (Deskripsi / Kisi-Kisi) -->
      <div class="flex flex-col gap-2">
        <!-- Tiny label bar above -->
        <div class="w-24 h-2.5 skeleton-bar-dark"></div>
        <!-- Tall multiline field with three light bars -->
        <div class="w-full h-28 bg-white rounded-xl border border-neutral-300 p-3.5 flex flex-col gap-2.5">
          <div class="w-11/12 h-2.5 skeleton-bar-light"></div>
          <div class="w-3/4 h-2.5 skeleton-bar-light"></div>
          <div class="w-1/2 h-2.5 skeleton-bar-light"></div>
        </div>
      </div>

      <!-- Field 3: Dropdown Field with Chevron (Mata Pelajaran / Tingkat Kelas) -->
      <div class="flex flex-col gap-2">
        <!-- Tiny label bar above -->
        <div class="w-24 h-2.5 skeleton-bar-dark"></div>
        <!-- Dropdown input with chevron icon -->
        <div class="w-full h-12 bg-white rounded-xl border border-neutral-300 px-3.5 flex items-center justify-between">
          <div class="w-32 h-3 skeleton-bar-light"></div>
          <!-- Chevron icon -->
          <svg class="w-4 h-4 text-neutral-500" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </div>
      </div>

      <!-- Field 4: Dashed-outline Upload Area -->
      <div class="flex flex-col gap-2">
        <!-- Tiny label bar above -->
        <div class="w-28 h-2.5 skeleton-bar-dark"></div>
        <!-- Dashed upload area with a circle and a short bar -->
        <div class="w-full h-32 rounded-xl border-2 border-dashed border-neutral-300 bg-neutral-50/40 flex flex-col items-center justify-center gap-2.5">
          <!-- Circle icon/avatar representation -->
          <div class="w-9 h-9 rounded-full bg-neutral-200 flex items-center justify-center">
            <!-- Simple geometric upload / arrow / circle motif -->
            <div class="w-3.5 h-3.5 rounded-full border-2 border-neutral-400"></div>
          </div>
          <!-- Short bar representing upload hint -->
          <div class="w-28 h-2.5 skeleton-bar-light"></div>
          <div class="w-16 h-2 skeleton-bar-faint"></div>
        </div>
      </div>

    </div>

    <!-- Fixed Bottom Actions Area (Side-by-side buttons, No bottom nav) -->
    <div class="w-full px-4 pt-3 pb-3 bg-white border-t border-neutral-100 flex items-center gap-3 shrink-0">
      <!-- Left Outlined Secondary Button -->
      <div class="flex-1 h-12 rounded-xl border border-neutral-800 bg-white flex items-center justify-center">
        <div class="w-16 h-3 bg-neutral-600 rounded-full"></div>
      </div>

      <!-- Right Solid Black Primary Button -->
      <div class="flex-1 h-12 rounded-xl bg-[#111111] flex items-center justify-center">
        <div class="w-20 h-3 bg-white rounded-full"></div>
      </div>
    </div>

    <!-- Home Indicator -->
    <div class="w-full pb-2 flex justify-center shrink-0">
      <div class="w-32 h-1 bg-black rounded-full"></div>
    </div>
  </div>

</body>
</html>
